<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#07080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SENRAI">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="senrai-logo.png">
<link rel="apple-touch-icon" href="senrai-logo.png">

<title>SENRAI — The System that moves you forward.</title>

<style>
:root{
  --bg:#07080c;
  --panel:#0d1017;
  --panel2:#11151e;
  --line:rgba(255,255,255,.09);
  --text:#f4f6fb;
  --muted:#8e97a8;
  --cyan:#65e7ff;
  --purple:#9b7cff;
  --red:#ff536b;
  --green:#69e6a3;
  --gold:#ffd36a;
  --shadow:0 18px 55px rgba(0,0,0,.35);
  --radius:22px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  color:inherit;
  border:0;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.045;
  background-image:radial-gradient(#fff .6px,transparent .6px);
  background-size:5px 5px;
  mix-blend-mode:screen;
  z-index:100;
}

#app{
  min-height:100vh;
  padding-bottom:96px;
}

.screen{
  display:none;
  max-width:900px;
  margin:auto;
  padding:22px 18px 34px;
}

.screen.active{
  display:block;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:4px 0 24px;
}

.brand{
  font-weight:900;
  letter-spacing:.24em;
  font-size:18px;
}

.eyebrow{
  font-size:10px;
  letter-spacing:.22em;
  color:var(--muted);
  text-transform:uppercase;
}

.top-action{
  background:rgba(255,255,255,.055);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
}

.card{
  background:
    linear-gradient(
      145deg,
      rgba(17,21,30,.96),
      rgba(10,12,18,.96)
    );
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  margin-bottom:14px;
  position:relative;
  overflow:hidden;
}

.card:after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  right:-90px;
  top:-100px;
  border-radius:50%;
  background:rgba(101,231,255,.05);
  filter:blur(8px);
  pointer-events:none;
}

.hero{
  padding:22px;
  text-align:center;
}

.hero h1{
  font-size:32px;
  margin:5px 0 3px;
}

.sub{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.level{
  font-size:13px;
  color:var(--cyan);
  letter-spacing:.12em;
  text-transform:uppercase;
  font-weight:800;
}

.xpbar{
  height:7px;
  border-radius:99px;
  background:#1a1e27;
  overflow:hidden;
  margin:14px 0 6px;
}

.xpbar>span{
  display:block;
  height:100%;
  background:
    linear-gradient(
      90deg,
      var(--cyan),
      var(--purple)
    );
  border-radius:99px;
  transition:width .35s ease;
}

.xptext{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:var(--muted);
}

/* SYSTEM CORE */

.core{
  min-height:360px;
  display:grid;
  place-items:center;
  position:relative;
  background:
    radial-gradient(
      circle at center,
      rgba(101,231,255,.11),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #0d1119,
      #080a10
    );
}

.core-rings{
  position:absolute;
  width:275px;
  height:275px;
  border:1px solid rgba(101,231,255,.18);
  border-radius:50%;
  animation:spin 24s linear infinite;
}

.core-rings:before,
.core-rings:after{
  content:"";
  position:absolute;
  inset:23px;
  border:1px solid rgba(155,124,255,.15);
  border-radius:50%;
}

.core-rings:after{
  inset:56px;
  border-style:dashed;
  animation:spin 12s linear infinite reverse;
}

.core-orbit{
  position:absolute;
  width:310px;
  height:150px;
  border:1px solid rgba(255,255,255,.06);
  border-radius:50%;
  transform:rotate(-22deg);
  animation:spin 18s linear infinite;
}

.core-dot{
  position:absolute;
  width:8px;
  height:8px;
  background:var(--cyan);
  box-shadow:0 0 22px var(--cyan);
  border-radius:50%;
  top:7px;
  left:50%;
}

.core-center{
  text-align:center;
  z-index:2;
}

.core-center .status{
  font-size:10px;
  letter-spacing:.3em;
  color:var(--cyan);
  font-weight:800;
}

.core-center .big{
  font-size:40px;
  font-weight:900;
  letter-spacing:.04em;
  margin:7px 0;
}

.core-center .path{
  font-size:12px;
  color:var(--muted);
}

.core-center .glyph{
  font-size:25px;
  margin-bottom:5px;
  color:var(--purple);
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* GRIDS */

.grid{
  display:grid;
  gap:12px;
}

.grid2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.stat{
  text-align:center;
  padding:16px 10px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
  border-radius:17px;
}

.stat b{
  display:block;
  font-size:21px;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.12em;
  margin-top:4px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:24px 3px 10px;
}

.section-title h2{
  font-size:14px;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin:0;
}

.section-title span{
  font-size:11px;
  color:var(--muted);
}

/* ROWS */

.row{
  display:flex;
  align-items:center;
  gap:12px;
}

.grow{
  flex:1;
}

.icon{
  width:42px;
  height:42px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:rgba(101,231,255,.08);
  border:1px solid rgba(101,231,255,.13);
  font-size:18px;
}

.item-title{
  font-weight:750;
  font-size:14px;
}

.item-meta{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  border-radius:99px;
  padding:6px 9px;
  font-size:10px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
}

.pill.cyan{
  color:var(--cyan);
  border-color:rgba(101,231,255,.2);
}

.pill.red{
  color:var(--red);
  border-color:rgba(255,83,107,.2);
}

.pill.gold{
  color:var(--gold);
  border-color:rgba(255,211,106,.2);
}

.pill.green{
  color:var(--green);
  border-color:rgba(105,230,163,.2);
}

/* BUTTONS */

.btn{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  padding:11px 14px;
  border-radius:13px;
  font-weight:750;
  font-size:12px;
}

.btn.primary{
  background:
    linear-gradient(
      135deg,
      rgba(101,231,255,.18),
      rgba(155,124,255,.18)
    );
  border-color:rgba(101,231,255,.25);
}

.btn.danger{
  border-color:rgba(255,83,107,.25);
  color:var(--red);
}

.btn.gold{
  color:var(--gold);
  border-color:rgba(255,211,106,.25);
}

.btn.full{
  width:100%;
}

/* QUESTS */

.quest.done{
  opacity:.58;
}

.quest.done .item-title{
  text-decoration:line-through;
}

.check{
  width:34px;
  height:34px;
  border-radius:50%;
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  display:grid;
  place-items:center;
  font-size:14px;
}

.quest.done .check{
  background:rgba(105,230,163,.14);
  border-color:rgba(105,230,163,.3);
  color:var(--green);
}

/* FORMS */

textarea,
input,
select{
  width:100%;
  background:#090c12;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  outline:none;
}

textarea:focus,
input:focus,
select:focus{
  border-color:rgba(101,231,255,.35);
}

textarea{
  min-height:110px;
  resize:vertical;
}

.form-row{
  display:flex;
  gap:8px;
}

.form-row>*{
  flex:1;
}

/* OTHER */

.quote{
  font-size:18px;
  line-height:1.45;
  font-weight:700;
}

.quote em{
  font-style:normal;
  color:var(--cyan);
}

.tiny{
  font-size:10px;
  color:var(--muted);
  line-height:1.5;
}

.timeline{
  border-left:1px solid var(--line);
  margin-left:8px;
  padding-left:18px;
}

.timeline-item{
  position:relative;
  margin-bottom:18px;
}

.timeline-item:before{
  content:"";
  position:absolute;
  left:-24px;
  top:4px;
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 12px rgba(101,231,255,.5);
}

.empty{
  padding:24px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

.achievement{
  min-height:110px;
}

.achievement.unlocked{
  border-color:rgba(255,211,106,.2);
}

/* NAV */

.nav{
  position:fixed;
  z-index:90;
  bottom:0;
  left:0;
  right:0;
  height:82px;
  padding:
    9px
    12px
    calc(9px + env(safe-area-inset-bottom));
  background:rgba(7,8,12,.92);
  backdrop-filter:blur(22px);
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav button{
  background:none;
  color:#687181;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.08em;
  min-width:55px;
}

.nav button.active{
  color:var(--text);
}

.nav .life-btn{
  position:relative;
  top:-21px;
}

.life-circle{
  width:62px;
  height:62px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:
    radial-gradient(
      circle at 35% 30%,
      #202735,
      #0b0e15
    );
  border:1px solid rgba(101,231,255,.38);
  box-shadow:
    0 0 30px rgba(101,231,255,.12),
    0 12px 30px rgba(0,0,0,.45);
  font-size:20px;
}

.nav .life-btn.active .life-circle{
  border-color:var(--cyan);
  box-shadow:
    0 0 32px rgba(101,231,255,.22);
}

/* SPLASH */

#splash{
  position:fixed;
  inset:0;
  background:#050609;
  z-index:999;
  display:grid;
  place-items:center;
  transition:opacity .55s ease;
}

.splash-inner{
  text-align:center;
}

.splash-logo{
  width:110px;
  height:110px;
  object-fit:contain;
  filter:drop-shadow(0 0 25px rgba(101,231,255,.18));
  animation:pulse 2s ease-in-out infinite;
}

.splash-word{
  font-size:16px;
  font-weight:900;
  letter-spacing:.35em;
  margin:16px 0 7px 7px;
}

.boot{
  font-size:9px;
  letter-spacing:.22em;
  color:#626b7b;
  text-transform:uppercase;
}

@keyframes pulse{
  50%{
    transform:scale(1.035);
    opacity:.78;
  }
}

/* MODAL */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:200;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:14px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(620px,100%);
  background:#0c1017;
  border:1px solid var(--line);
  border-radius:24px 24px 18px 18px;
  padding:20px;
  box-shadow:0 25px 80px rgba(0,0,0,.6);
  max-height:88vh;
  overflow:auto;
}

.modal h3{
  margin:0 0 5px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:94px;
  transform:
    translateX(-50%)
    translateY(20px);
  opacity:0;
  z-index:300;
  background:#151a24;
  border:1px solid var(--line);
  padding:11px 15px;
  border-radius:14px;
  font-size:12px;
  transition:.25s;
  pointer-events:none;
  box-shadow:var(--shadow);
}

.toast.show{
  opacity:1;
  transform:
    translateX(-50%)
    translateY(0);
}

/* MOOD */

.mood{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.mood button{
  padding:9px 11px;
  border-radius:12px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  font-size:11px;
  color:var(--muted);
}

.mood button.active{
  color:var(--text);
  border-color:rgba(101,231,255,.35);
  background:rgba(101,231,255,.08);
}

/* PATH */

.stage{
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.stage:last-child{
  border-bottom:0;
}

.stage-num{
  width:28px;
  height:28px;
  border-radius:9px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.05);
  color:var(--muted);
  font-size:11px;
}

.stage.current .stage-num{
  background:rgba(101,231,255,.12);
  color:var(--cyan);
}

.stage.complete .stage-num{
  background:rgba(105,230,163,.12);
  color:var(--green);
}

@media(max-width:560px){
  .grid3{
    grid-template-columns:repeat(3,1fr);
  }

  .hero h1{
    font-size:28px;
  }

  .core{
    min-height:320px;
  }

  .core-rings{
    width:245px;
    height:245px;
  }

  .core-orbit{
    width:275px;
  }
}
</style>
</head>

<body>

<div id="splash">
  <div class="splash-inner">
    <img
      class="splash-logo"
      src="senrai-logo.png"
      alt="SENRAI"
      onerror="this.style.display='none'"
    >

    <div class="splash-word">SENRAI</div>
    <div class="boot">SYSTEM INITIALIZING</div>
  </div>
</div>

<div id="app">

  <section id="home" class="screen active"></section>

  <section id="quests" class="screen"></section>

  <section id="life" class="screen"></section>

  <section id="stats" class="screen"></section>

  <section id="moments" class="screen"></section>

</div>

<nav class="nav">

  <button
    data-view="home"
    onclick="showView('home')"
  >
    <span>⌂</span>
    <span>Home</span>
  </button>

  <button
    data-view="quests"
    onclick="showView('quests')"
  >
    <span>◇</span>
    <span>Quests</span>
  </button>

  <button
    data-view="life"
    class="life-btn"
    onclick="showView('life')"
  >
    <span class="life-circle">✦</span>
    <span>Life</span>
  </button>

  <button
    data-view="stats"
    onclick="showView('stats')"
  >
    <span>◌</span>
    <span>Stats</span>
  </button>

  <button
    data-view="moments"
    onclick="showView('moments')"
  >
    <span>◈</span>
    <span>Moments</span>
  </button>

</nav>

<div
  id="modal"
  class="modal-backdrop"
  onclick="if(event.target===this)closeModal()"
>
  <div id="modalBody" class="modal"></div>
</div>

<div id="toast" class="toast"></div>

/* =========================================================

function localDateKey(d = new Date()){

  return (
    d.getFullYear() +
    '-' +
    String(d.getMonth()+1).padStart(2,'0') +
    '-' +
    String(d.getDate()).padStart(2,'0')
  );

}

function weekKey(d = new Date()){

  const x = new Date(d);

  const day = x.getDay();

  x.setDate(
    x.getDate() -
    (day === 0 ? 6 : day - 1)
  );

  return localDateKey(x);

}

function uid(){

  return (
    Date.now().toString(36) +
    Math.random().toString(36).slice(2,7)
  );

}

let data = load();

function load(){

  try{

    const raw = localStorage.getItem(KEY);

    if(raw){

      return Object.assign(
        defaults(),
        JSON.parse(raw)
      );

    }

  }catch(e){

    console.warn('SENRAI storage recovery:',e);

  }

  return defaults();

}

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

}


/* =========================================================
   SYSTEM CALCULATIONS
   ========================================================= */

function level(){

  return Math.floor(
    data.totalXP / 100
  ) + 1;

}

function levelXP(){

  return data.totalXP % 100;

}

function title(){

  const l = level();

  if(l >= 30) return 'AWAKENED';

  if(l >= 20) return 'WAYFINDER';

  if(l >= 10) return 'PATHFINDER';

  if(l >= 5) return 'INITIATE';

  return 'SEEKER';

}

function currentPath(){

  return PATHS[data.path] || PATHS.Explorer;

}

function insight(){

  const counts = {};

  data.history.forEach(x=>{

    counts[x.type] =
      (counts[x.type] || 0) + 1;

  });

  const fav =
    Object.entries(counts)
      .sort((a,b)=>b[1]-a[1])[0]?.[0]
    || '—';

  data.favorite = fav;

  const weakest =
    TYPES
      .filter(x=>x !== 'LIFE')
      .sort(
        (a,b)=>
          (counts[a] || 0) -
          (counts[b] || 0)
      )[0]
    || 'CARE';

  const msgs = {

    LOW:
      'Lower the difficulty. A small win still moves you forward.',

    CALM:
      'You have room to choose deliberately. Follow curiosity.',

    FOCUSED:
      'Use the momentum. Finish one meaningful thing.',

    RESTLESS:
      'Change your environment. Movement may unlock the next step.',

    MOTIVATED:
      'This is a good window for a slightly harder quest.',

    LOST:
      'Do not solve your whole life tonight. Choose one direction.'

  };

  return {
    fav,
    weakest,
    msg:msgs[data.mood] || msgs.CALM
  };

}


/* =========================================================
   DAILY RESET
   ========================================================= */

function resetDayIfNeeded(){

  if(data.day !== localDateKey()){

    data.day = localDateKey();

    data.daily = [];

    data.life = {
      text:'',
      type:'',
      detail:'',
      used:data.life.used || []
    };

    save();

  }

}


/* =========================================================
   DAILY QUEST GENERATION
   ========================================================= */

function dailyQuests(){

  resetDayIfNeeded();

  if(!data.daily.length){

    const shuffled =
      [...QUEST_POOL]
        .sort(()=>Math.random()-.5);

    data.daily =
      shuffled
        .slice(0,4)
        .map(q=>({

          id:uid(),
          text:q[0],
          type:q[1],
          xp:q[2],
          done:false

        }));

    save();

  }

  return data.daily;

}

/* =========================================================
   WEEKLY DATA
   ========================================================= */

function ensureWeekly(){

  const currentWeek = weekKey();

  if(
    data.weekly.key !== currentWeek ||
    !data.weekly.missions.length
  ){

    data.weekly = {

      key:currentWeek,

      claimed:[],

      missions:[

        {
          id:'w1',
          text:'Complete 5 quests',
          goal:5,
          progress:Math.min(5,data.completed),
          xp:50,
          icon:'◇'
        },

        {
          id:'w2',
          text:'Complete 2 Life encounters',
          goal:2,
          progress:Math.min(2,data.lifeDone),
          xp:60,
          icon:'✦'
        },

        {
          id:'w3',
          text:'Write 3 Moments',
          goal:3,
          progress:
            Math.min(
              3,
              data.moments.filter(
                m=>m.date >= currentWeek
              ).length
            ),
          xp:40,
          icon:'◈'
        }

      ]

    };

    save();

  }else{

    data.weekly.missions[0].progress =
      Math.min(5,data.completed);

    data.weekly.missions[1].progress =
      Math.min(2,data.lifeDone);

    data.weekly.missions[2].progress =
      Math.min(
        3,
        data.moments.filter(
          m=>m.date >= currentWeek
        ).length
      );

  }

}

/* =========================================================
   XP REWARD
   ========================================================= */

function reward(xp,text,type){

  data.totalXP += xp;

  data.completed++;

  data.history.push({

    text,
    xp,
    type,
    date:localDateKey()

  });

  advancePath(type);

  checkAchievements();

  save();

  renderAll();

}


/* =========================================================
   PATH PROGRESSION
   ========================================================= */

function advancePath(type){

  const map = {

    EXPLORATION:'Explorer',
    CREATIVE:'Builder',
    DISCIPLINE:'Discipline',
    SOCIAL:'Connection',
    CARE:'Balance'

  };

  if(
    map[type] &&
    data.path !== map[type] &&
    data.completed >= 3
  ){

    data.path = map[type];

  }

  if(
    data.completed &&
    data.completed % 4 === 0
  ){

    data.pathProgress =
      Math.min(
        currentPath().stages.length,
        data.pathProgress + 1
      );

  }

}


/* =========================================================
   ACHIEVEMENT CHECKING
   ========================================================= */

function checkAchievements(){

  const exploration =
    data.history.filter(
      h=>h.type === 'EXPLORATION'
    ).length;

  const candidates = {

    first:
      data.completed >= 1,

    ten:
      data.completed >= 10,

    life1:
      data.lifeDone >= 1,

    moment1:
      data.moments.length >= 1,

    level5:
      level() >= 5,

    explorer:
      exploration >= 5

  };


  Object.entries(candidates)
    .forEach(([id,ok])=>{

      if(
        ok &&
        !data.achievements[id]
      ){

        data.achievements[id] =
          localDateKey();

        data.totalXP += 25;

        data.history.push({

          text:
            'Achievement unlocked: ' +
            id,

          xp:25,

          type:'ACHIEVEMENT',

          date:localDateKey()

        });

        toast(
          'ACHIEVEMENT UNLOCKED · +25 XP'
        );

      }

    });

}


/* =========================================================
   WEEKLY CLAIM
   ========================================================= */

function claimWeekly(id){

  ensureWeekly();

  const m =
    data.weekly.missions.find(
      x=>x.id===id
    );

  if(!m){
    return;
  }

  if(m.progress < m.goal){
    return;
  }

  if(
    data.weekly.claimed.includes(id)
  ){
    return;
  }

  /*
    IMPORTANT FIX:

    Mark claimed BEFORE rendering.

    This prevents:

    renderAll()
      ↓
    renderWeekly()
      ↓
    reward()
      ↓
    renderAll()
      ↓
    renderWeekly()
      ↓
    reward()
      ↓
    INFINITE LOOP

    Weekly missions are now render-only.
  */

  data.weekly.claimed.push(id);

  data.totalXP += m.xp;

  data.history.push({

    text:
      'Weekly mission: ' +
      m.text,

    xp:m.xp,

    type:'WEEKLY',

    date:localDateKey()

  });

  save();

  renderAll();

  toast(
    'WEEKLY REWARD · +' +
    m.xp +
    ' XP'
  );

}


/* =========================================================
   LIFE ENCOUNTERS
   ========================================================= */

function newLife(){

  let used =
    data.life.used || [];

  if(
    used.length >=
    ENCOUNTERS.length
  ){

    used = [];

  }

  const available =
    ENCOUNTERS
      .map((x,i)=>({x,i}))
      .filter(
        o=>!used.includes(o.i)
      );

  const pick =
    available[
      Math.floor(
        Math.random() *
        available.length
      )
    ];

  data.life = {

    text:pick.x[0],

    type:pick.x[1],

    detail:pick.x[2],

    used:[
      ...used,
      pick.i
    ]

  };

  save();

  renderAll();

  showView('life');

}


function completeLife(){

  if(!data.life.text){

    newLife();

    return;

  }

  data.lifeDone++;

  data.totalXP += 25;

  data.history.push({

    text:data.life.text,

    xp:25,

    type:'LIFE',

    date:localDateKey()

  });

  checkAchievements();

  save();

  renderAll();

  toast(
    'LIFE ENCOUNTER COMPLETE · +25 XP'

}

/* =========================================================
   NAVIGATION
   ========================================================= */

function showView(view){

  document
    .querySelectorAll('.screen')
    .forEach(s=>
      s.classList.remove('active')
    );

  document
    .getElementById(view)
    .classList.add('active');

  updateNav();

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


function updateNav(){

  const active =
    document
      .querySelector('.screen.active');

  if(!active){
    return;
  }

  document
    .querySelectorAll(
      '.nav button[data-view]'
    )
    .forEach(b=>{

      b.classList.toggle(
        'active',
        b.dataset.view === active.id
      );

    });

}


/* =========================================================
   MODALS
   ========================================================= */

function openModal(html){

  document
    .getElementById('modalBody')
    .innerHTML = html;

  document
    .getElementById('modal')
    .classList.add('show');

}


function closeModal(){

  document
    .getElementById('modal')
    .classList.remove('show');

}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;

function toast(text){

  const el =
    document.getElementById('toast');

  el.textContent = text;

  el.classList.add('show');

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(
      ()=>el.classList.remove('show'),
      2200
    );

}


/* =========================================================
   ESCAPING
   ========================================================= */

function escapeHTML(s){

  return String(s).replace(
    /[&<>'"]/g,
    c=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'

    }[c])
  );

}


function escapeAttr(s){

  return escapeHTML(s);

}


/* =========================================================
   THEME
   ========================================================= */

function setTheme(){

  document
    .documentElement
    .style
    .setProperty(
      '--cyan',
      data.settings.accent || '#65e7ff'
    );

  document
    .querySelector(
      'meta[name="theme-color"]'
    )
    .setAttribute(
      'content',
      '#07080c'
    );

}


/* =========================================================
   BOOT
   ========================================================= */

function boot(){

  resetDayIfNeeded();

  ensureWeekly();

  renderAll();

  setTimeout(()=>{

    const splash =
      document.getElementById('splash');

    splash.style.opacity = '0';

    setTimeout(()=>{

      splash.remove();

    },600);

  },650);

}


window.addEventListener(
  'load',
  boot
);
