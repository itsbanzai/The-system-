/* ========================================================
   SENRAI — SUBTLE MOTION / LIVING SYSTEM LAYER
   ======================================================== */
body{overflow-x:hidden;background:#050609;position:relative}
body:before{content:"";position:fixed;inset:-25%;pointer-events:none;z-index:-3;background:radial-gradient(circle at 18% 18%,rgba(101,169,255,.055),transparent 25%),radial-gradient(circle at 82% 28%,rgba(168,124,255,.045),transparent 23%),radial-gradient(circle at 50% 92%,rgba(105,226,220,.035),transparent 25%);animation:systemAmbient 18s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:.045;background-image:radial-gradient(rgba(255,255,255,.55) .55px,transparent .55px);background-size:5px 5px;mix-blend-mode:screen}
@keyframes systemAmbient{0%{transform:translate3d(-2%,-1%,0) scale(1)}50%{transform:translate3d(2%,1%,0) scale(1.03)}100%{transform:translate3d(-1%,3%,0) scale(1.06)}}
#ambientParticles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.ambient-particle{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(190,215,255,.55);box-shadow:0 0 8px rgba(125,180,255,.35);animation:floatParticle var(--dur) ease-in-out infinite alternate;opacity:var(--op)}<section class="section"><div class="section-head"><div class="section-title">PATH</div><div class="desc">EVOLUTION</div></div><div id="pathEvolution"></div></section>
<section class="section"><div class="section-head"><div class="section-title">WEEKLY SYSTEM</div><div class="desc">CHALLENGE</div></div><div class="grid2" id="weeklySystem"></div></section>
<section class="section"><div class="section-head"><div class="section-title">SYSTEM EVENTS</div><div class="desc">DISCOVERIES</div></div><div id="systemEvents"></div></section>function completeCustom(id){const q=d.custom.find(x=>x.id===id);if(!q||q.done)return;q.done=true;reward(q.name,q.xp,q.stat,'CUSTOM','custom-'+id)}
function generateLife(){const q=LIFE[Math.floor(Math.random()*LIFE.length)];d.activeLife={type:q[0],text:q[1],stat:q[2],xp:q[3]};save();document.getElementById('lifeText').textContent=q[1];document.getElementById('homeLifeText').textContent=q[1];document.getElementById('lifeDone').disabled=false;document.getElementById('homeLifeDone').disabled=false;toast('LIFE ENCOUNTER GENERATED')}
function completeLife(){if(!d.activeLife)return;const q=d.activeLife;d.activeLife=null;reward(q.text,q.xp,q.stat,'LIFE','life-'+uid());document.getElementById('lifeDone').disabled=true;document.getElementById('homeLifeDone').disabled=true}
function renderStats(){document.getElementById('statsGrid').innerHTML=Object.keys(STAT_NAMES).map(s=>{const x=levelFromStatProgress(d.stats[s].progress);return`<div class="stat"><div class="stat-top"><div class="stat-name">${s} • ${STAT_NAMES[s]}</div><div class="stat-value">${x.level}</div></div><div class="stat-note">${STAT_NOTES[s]}</div><div class="stat-track"><div class="stat-fill ${s.toLowerCase()}" style="width:${x.pct}%"></div></div><div class="meta"><span>${Math.floor(x.remaining)} / ${x.need} PROGRESS</span><span>LVL ${x.level+1}</span></div></div>`}).join('')}
function weekKey(){const x=new Date(),one=new Date(x.getFullYear(),0,1);return x.getFullYear()+'-W'+Math.ceil((((x-one)/86400000)+one.getDay()+1)/7)}
function renderWeekly(){const key=weekKey();let w=JSON.parse(localStorage.getItem('senrai_weekly')||'null');if(!w||w.key!==key)w={key,claimed:[],missions:[{id:'w1',title:'COMPLETE 5 ACTIONS',desc:'Any completed action counts.',target:5,xp:100},{id:'w2',title:'TOUCH 3 STATS',desc:'Complete actions across three stats.',target:3,xp:100},{id:'w3',title:'CREATE A MOMENT',desc:'Record one meaningful moment.',target:1,xp:75}]};const start=new Date(),day=start.getDay(),diff=day===0?-6:1-day;start.setDate(start.getDate()+diff);start.setHours(0,0,0,0);const recent=d.actions.filter(a=>new Date(a.date)>=start),stats=new Set(recent.map(a=>a.stat));w.missions[0].progress=Math.min(5,recent.length);w.missions[1].progress=Math.min(3,stats.size);w.missions[2].progress=d.moments.some(m=>new Date(m.date)>=start)?1:0;localStorage.setItem('senrai_weekly',JSON.stringify(w));document.getElementById('weeklyGrid').innerHTML=w.missions.map(m=>`<div class="week"><div class="week-top"><div class="week-title">${m.title}</div><div class="week-xp">+${m.xp} XP</div></div><p>${m.desc}</p><div class="track"><div class="fill" style="width:${Math.min(100,m.progress/m.target*100)}%"></div></div><div class="meta"><span>${m.progress} / ${m.target}</span><span>${m.progress>=m.target?'COMPLETE':'IN PROGRESS'}</span></div></div>`).join('')}
function renderMoments(){const el=document.getElementById('momentList');if(!d.moments.length){el.innerHTML='<div class="empty">NO MOMENTS RECORDED YET.</div>';return}el.innerHTML=d.moments.slice().reverse().map(m=>`<div class="moment"><div class="moment-date">${new Date(m.date).toLocaleString()}</div><div class="moment-text">${esc(m.text)}</div></div>`).join('')}
function saveMoment(){const text=document.getElementById('momentInput').value.trim();if(!text)return toast('WRITE SOMETHING FIRST');d.moments.push({id:uid(),text,date:new Date().toISOString()});document.getElementById('momentInput').value='';save();toast('MOMENT RECORDED');renderMoments();recordJourney('MOMENT','A moment was recorded.','You chose to remember something instead of letting it disappear.');checkAchievements();renderWeekly()}
const ACH=[{id:'first',icon:'◇',name:'FIRST STEP',desc:'Complete your first action.',reward:25,check:()=>d.actions.length>=1},{id:'five',icon:'◆',name:'GETTING STARTED',desc:'Complete 5 actions.',reward:50,check:()=>d.actions.length>=5},{id:'level5',icon:'△',name:'RISING',desc:'Reach level 5.',reward:100,check:()=>d.level>=5},{id:'streak7',icon:'✦',name:'CONSISTENT',desc:'Reach a 7-day active streak.',reward:100,check:()=>d.streak>=7},{id:'xp1000',icon:'✧',name:'BUILDER',desc:'Earn 1,000 total XP.',reward:150,check:()=>d.totalXP>=1000},{id:'moment',icon:'◎',name:'REMEMBER THIS',desc:'Record your first Moment.',reward:50,check:()=>d.moments.length>=1},{id:'awakening',icon:'☼',name:'AWAKENING',desc:'Reach the Awakening threshold.',reward:300,check:()=>d.awakening}];
function checkAchievements(){let unlocked=JSON.parse(localStorage.getItem('senrai_achievements')||'{}'),changed=false;ACH.forEach(a=>{if(a.check()&&!unlocked[a.id]){unlocked[a.id]=true;d.xp+=a.reward;d.totalXP+=a.reward;changed=true;toast('ACHIEVEMENT — '+a.name)}});if(changed){localStorage.setItem('senrai_achievements',JSON.stringify(unlocked));levelFromXP();save()}}
function renderAchievements(){const unlocked=JSON.parse(localStorage.getItem('senrai_achievements')||'{}');document.getElementById('achievementGrid').innerHTML=ACH.map(a=>{const ok=!!unlocked[a.id];return`<div class="achievement ${ok?'':'locked'}"><div class="achievement-icon">${a.icon}</div><div style="position:absolute;right:12px;top:12px;color:${ok?'var(--green)':'var(--muted)'};font-size:7px;letter-spacing:1px">${ok?'UNLOCKED':'LOCKED'}</div><div class="achievement-title">${a.name}</div><div class="achievement-desc">${a.desc}</div><div class="achievement-reward">+${a.reward} XP</div></div>`}).join('')}
const TITLES=[['INITIATE','Begin your journey.'],['EXPLORER','Complete 5 actions.'],['CONSISTENT','Reach a 7-day streak.'],['BUILDER','Earn 1,000 XP.'],['ASCENDED','Reach level 10.'],['AWAKENED','Reach the Awakening threshold.']];
function renderTitles(){const current=currentTitle();document.getElementById('titlesGrid').innerHTML=TITLES.map(t=>`<div class="week"><div class="week-top"><div class="week-title">${t[0]}</div><div class="week-xp">${current===t[0]?'EQUIPPED':'TITLE'}</div></div><p>${t[1]}</p></div>`).join('')}
function renderHistory(){const el=document.getElementById('historyList');if(!d.actions.length){el.innerHTML='<div class="empty">NO SYSTEM ACTIVITY YET.</div>';return}el.innerHTML=d.actions.slice(0,50).map(a=>`<div class="history"><div><div class="history-title">${esc(a.title)}</div><div class="history-meta">${esc(a.source)} • ${esc(a.stat||'SYSTEM')} • ${new Date(a.date).toLocaleString()}</div></div><div class="history-xp">+${a.xp}</div></div>`).join('')}
function renderProfile(){document.getElementById('profileCard').innerHTML=`<div class="avatar">S</div><div class="profile-name">SENRAI USER</div><div class="profile-sub">${currentTitle()} • LEVEL ${d.level}</div><div class="profile-grid"><div class="profile-stat"><strong>${d.totalXP}</strong><span>TOTAL XP</span></div><div class="profile-stat"><strong>${d.actions.length}</strong><span>ACTIONS</span></div><div class="profile-stat"><strong>${d.streak}</strong><span>STREAK</span></div></div>`}
function renderSettings(){const g=document.getElementById('guidance'),m=document.getElementById('motion'),n=document.getElementById('notifications');g.textContent=d.guidance?'ON':'OFF';g.className='small '+(d.guidance?'primary':'');m.textContent=d.motion?'ON':'OFF';m.className='small '+(d.motion?'primary':'');n.textContent=d.notifications?'ON':'OFF';n.className='small '+(d.notifications?'primary':'');document.body.classList.toggle('reduced',!d.motion)}
function newObjective(){openModal('NEW OBJECTIVE',`<div class="form-grid"><div class="form-group full"><label>OBJECTIVE</label><input id="objName" maxlength="80" placeholder="What are you moving toward?"></div><div class="form-group"><label>CATEGORY</label><select id="objCat"><option>CAREER</option><option>LEARNING</option><option>FITNESS</option><option>FINANCE</option><option>HEALTH</option><option>CREATIVE</option><option>RELATIONSHIPS</option><option>PRODUCTIVITY</option><option>LIFE</option></select></div><div class="form-group"><label>WHY</label><input id="objReason" maxlength="120" placeholder="Why does it matter?"></div></div><button class="primary" style="width:100%;margin-top:12px" onclick="createObjective()">BUILD PATH</button>`)}
function createObjective(){const name=document.getElementById('objName').value.trim();if(!name)return toast('ENTER AN OBJECTIVE');const cat=document.getElementById('objCat').value,reason=document.getElementById('objReason').value.trim(),short=name.length>32?name.slice(0,32)+'…':name;d.objectives.unshift({id:uid(),name,category:cat,reason,progress:0,done:false,steps:[['FOUNDATION','Start '+short,'WIS',25],['MOMENTUM','Work on '+short,'DEX',50],['MOVE FORWARD','Move '+short+' forward','STR',75]].map(x=>({id:uid(),phase:x[0],name:x[1],stat:x[2],xp:x[3],done:false}))});save();closeModal();render();toast('OBJECTIVE CREATED');recordJourney('OBJECTIVE','A new objective was created.','SENRAI built a path from your intention.')}
function renderObjectives(){const el=document.getElementById('objectivesList');if(!d.objectives.length){el.innerHTML='<div class="empty">NO OBJECTIVES YET. CREATE ONE AND SENRAI WILL BUILD A PATH.</div>';return}el.innerHTML=d.objectives.map(o=>`<div class="path-card" style="margin-bottom:10px"><div class="path-head"><div><div class="label">${esc(o.category)} • OBJECTIVE</div><div class="path-name">${esc(o.name)}</div></div><span class="chip">${o.progress}%</span></div><div class="track" style="margin-top:13px"><div class="fill" style="width:${o.progress}%"></div></div><div class="meta"><span>${o.steps.filter(x=>x.done).length}/${o.steps.length} STEPS</span><button class="small" onclick="openObjective('${o.id}')">OPEN PATH</button></div></div>`).join('')}
function openObjective(id){const o=d.objectives.find(x=>x.id===id);if(!o)return;document.getElementById('objectivePathSection').classList.remove('hidden');document.getElementById('objectivePath').innerHTML=`<div class="path-card"><div class="label">${esc(o.category)} • OBJECTIVE</div><div class="path-name">${esc(o.name)}</div><p style="margin-top:7px">${esc(o.reason||'A goal worth moving toward.')}</p>${o.steps.map(s=>`<div class="quest ${s.done?'complete':''}" style="margin-top:9px"><div class="quest-main"><h3>${s.phase}</h3><p>${esc(s.name)}</p><div class="pills"><span class="pill xp">+${s.xp} XP</span><span class="pill">${s.stat}</span></div></div><button class="small ${s.done?'':'primary'}" ${s.done?'disabled':''} onclick="completeStep('${o.id}','${s.id}')">${s.done?'DONE':'COMPLETE'}</button></div>`).join('')}</div>`;document.getElementById('objectivePathSection').scrollIntoView({behavior:'smooth'})}
function completeStep(oid,sid){const o=d.objectives.find(x=>x.id===oid),s=o?.steps.find(x=>x.id===sid);if(!s||s.done)return;s.done=true;o.progress=Math.round(o.steps.filter(x=>x.done).length/o.steps.length*100);o.done=o.progress===100;reward(s.name,s.xp,s.stat,'OBJECTIVE',sid);save();openObjective(oid);if(o.done)recordJourney('OBJECTIVE COMPLETE',o.name,'You moved a real objective across the finish line.')}
function bossTier(){if(d.level>=10)return 2;if(d.level>=5)return 1;return 0}
function generateBossIfNeeded(){if(d.boss&&d.boss.status==='ACTIVE')return;if(d.actions.length<5)return;const last=d.bossHistory[d.bossHistory.length-1];const choices=BOSS_POOL.filter(x=>x[0]!==last?.title);const q=choices[Math.floor(Math.random()*choices.length)];d.boss={id:uid(),title:q[0],desc:q[1],stat:q[2],xp:q[3]+bossTier()*25,status:'ACTIVE',created:new Date().toISOString()};save();recordJourney('BOSS APPEARED',d.boss.title,'An optional challenge has entered the System.')}
function renderBoss(){const el=document.getElementById('homeBoss');if(!d.boss||d.boss.status!=='ACTIVE'){el.innerHTML='<div class="empty">No Boss Quest available yet. Keep moving. The System will reveal one when the time is right.</div>';return}el.innerHTML=`<div class="boss"><div class="boss-tag">OPTIONAL BOSS QUEST</div><div class="boss-title">${esc(d.boss.title)}</div><p>${esc(d.boss.desc)}</p><div class="pills" style="margin-top:10px"><span class="pill xp">+${d.boss.xp} XP</span><span class="pill">${d.boss.stat}</span><span class="pill">NO PENALTY</span></div><div class="boss-actions"><button class="primary" onclick="completeBoss()">DEFEAT BOSS</button><button onclick="dismissBoss()">LEAVE FOR LATER</button></div></div>`}
function completeBoss(){if(!d.boss||d.boss.status!=='ACTIVE')return;const q=d.boss;d.boss.status='COMPLETE';d.bossHistory.push({title:q.title,date:new Date().toISOString()});save();reward(q.title,q.xp,q.stat,'BOSS','boss-'+q.id);recordJourney('BOSS DEFEATED',q.title,'You chose to take on an optional challenge.');d.boss=null;save();render();toast('BOSS DEFEATED')}
function dismissBoss(){if(!d.boss)return;d.boss.status='DISMISSED';d.bossHistory.push({title:d.boss.title,date:new Date().toISOString()});d.boss=null;save();renderBoss();toast('BOSS REMAINS OPTIONAL')}
function journeySeed(){const out=[];if(d.createdAt)out.push({date:d.createdAt,title:'SYSTEM ACTIVATED',type:'ORIGIN',text:'SENRAI was initialized. Your journey began before you knew what direction it would take.'});if(d.actions.length)out.push({date:d.actions[d.actions.length-1].date,title:'FIRST ACTION',type:'MILESTONE',text:'The first recorded action connected your behavior to the System.'});if(d.streak>=7)out.push({date:new Date().toISOString(),title:'CONSISTENCY DETECTED',type:'MILESTONE',text:'A 7-day active streak has been reached.'});if(d.level>=5)out.push({date:new Date().toISOString(),title:'SYSTEM RESPONSE',type:'MILESTONE',text:'Your progress crossed a threshold and deeper System behavior became available.'});if(d.path.stage>=2)out.push({date:new Date().toISOString(),title:'PATH EMERGED',type:'DISCOVERY',text:`Your actions are currently leaning toward the ${currentPath()} Path.`});if(d.bossHistory.length)out.push({date:d.bossHistory[d.bossHistory.length-1].date,title:'FIRST BOSS DEFEATED',type:'MILESTONE',text:d.bossHistory[d.bossHistory.length-1].title});if(d.awakening)out.push({date:new Date().toISOString(),title:'AWAKENING',type:'DISCOVERY',text:'The System recognized enough progression to change its relationship with you.'});d.moments.slice(-8).forEach(m=>out.push({date:m.date,title:'MOMENT RECORDED',type:'MEMORY',text:m.text}));return out.sort((a,b)=>new Date(a.date)-new Date(b.date))}
function recordJourney(type,title,text){d.journey=d.journey||[];d.journey.push({id:uid(),date:new Date().toISOString(),type,title,text});save();renderJourney()}
function renderJourney(){const el=document.getElementById('journeyTimeline'),events=[...journeySeed(),...(d.journey||[])].sort((a,b)=>new Date(a.date)-new Date(b.date));if(!events.length){el.innerHTML='<div class="journey-empty">YOUR STORY HAS NOT STARTED YET.</div>';return}const unique=[];const keys=new Set();events.forEach(e=>{const k=e.title+'|'+e.type;if(!keys.has(k)){keys.add(k);unique.push(e)}});el.innerHTML=unique.map(e=>`<div class="journey-card"><div class="journey-date">${new Date(e.date).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'})}</div><div class="journey-title">${esc(e.title)}</div><p>${esc(e.text)}</p><div class="journey-type">${esc(e.type)}</div></div>`).join('')}

function awakeningEvent(){openModal('AWAKENING',`<div style="text-align:center;padding:18px"><div class="label" style="color:var(--purple)">SYSTEM ANALYSIS COMPLETE</div><div style="font-size:29px;font-weight:950;margin-top:12px">AWAKENING</div><p style="margin-top:12px">You are no longer using the System the same way you were when you started. SENRAI has enough history to recognize a pattern in how you move through life.</p><div style="margin-top:16px"><span class="system-chip" style="display:inline-block;color:var(--purple);border-color:rgba(168,124,255,.25)">✦ NEW LAYER UNLOCKED</span></div><div style="color:#596272;font-size:8px;margin-top:13px">PATH • BOSS QUESTS • DEEPER INTELLIGENCE • JOURNEY</div></div>`);recordJourney('AWAKENING','SYSTEM AWAKENED','A new layer of SENRAI became available.')}
function systemEvent(){triggerSystemGlitch(false);const completed=d.actions.length;let e;if(d.awakening)e=['AWAKENING','THE SYSTEM HAS AWAKENED.','SENRAI is no longer simply tracking your progress. Your actions have shaped the System itself.'];else if(completed>=10)e=['PATTERN','A PATTERN HAS EMERGED.','SENRAI has enough information to recognize the direction your actions are creating.'];else if(d.streak>=7)e=['CONSISTENCY','CONSISTENCY HAS WEIGHT.','Seven active days changes the shape of a habit. You do not need to be perfect. You only need to keep returning.'];else if(d.level>=5)e=['SYSTEM','THE SYSTEM IS RESPONDING.','Your progress has reached a threshold. Rarer discoveries are beginning to become available.'];else if(completed>=1)e=['CONNECTION','SYSTEM CONNECTION ESTABLISHED.','Your first action is recorded. SENRAI will use what you actually do—not what you promise—to shape future guidance.'];else e=['READY','THE SYSTEM IS AWAKE.','There is nothing you need to prove. Start small. Do something that makes your life better.'];if(d.seen.includes(e[0]))return;d.seen.push(e[0]);save();openModal('SYSTEM EVENT',`<div style="text-align:center;padding:14px"><div class="label">SYSTEM EVENT</div><div style="font-size:21px;font-weight:900;margin-top:10px">${e[1]}</div><p style="margin-top:12px">${e[2]}</p><span class="system-chip" style="display:inline-block;margin-top:15px">✦ SENRAI</span></div>`)}
function levelUp(l){triggerSystemGlitch(true);openModal('LEVEL UP',`<div style="text-align:center;padding:18px"><div class="label" style="color:var(--cyan)">SYSTEM EVOLUTION</div><div style="font-size:50px;font-weight:950;margin-top:10px">${l}</div><div style="color:var(--muted);font-size:10px;letter-spacing:2px">LEVEL ${l} REACHED</div><p style="margin-top:16px">Your progress has changed. Keep moving forward. The System will reveal what comes next.</p><span class="system-chip" style="display:inline-block;margin-top:15px">✦ CORE SYNCHRONIZED</span></div>`);pulse()}

function initAmbientParticles(){
  const layer=document.getElementById('ambientParticles');
  if(!layer || window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const count=window.innerWidth<700?18:30;
  for(let i=0;i<count;i++){
    const p=document.createElement('span');
    p.className='ambient-particle';
    p.style.left=(Math.random()*100)+'%';
    p.style.top=(Math.random()*105)+'%';
    p.style.setProperty('--dur',(7+Math.random()*10)+'s');
    p.style.setProperty('--drift',(-25+Math.random()*50)+'px');
    p.style.setProperty('--op',(0.18+Math.random()*0.38).toFixed(2));
    p.style.animationDelay=(-Math.random()*12)+'s';
    layer.appendChild(p);
  }
}

function authMessage(msg,ok=false){
 authStatus.textContent=msg;

function setAuthMode(mode){
 authMode=mode;
 const signup=mode==='signup';
 signInTab.classList.toggle('active',!signup);
 signUpTab.classList.toggle('active',signup);
 confirmWrap.classList.toggle('hidden',!signup);
 document.getElementById('authConfirm').required=signup;

 authSub.textContent=signup?'Create your SENRAI account and begin building your personal progression system.':'Sign in to continue your personal progression system.';
 authSubmit.textContent=signup?'INITIALIZE SYSTEM':'ENTER SYSTEM';
 authMessage('');
}

function showAuth(){
 document.getElementById('app').classList.add('auth-locked');
 document.querySelector('.nav').classList.add('auth-locked');
 authGate.classList.add('show');
 document.getElementById('splash').classList.add('hidden');
 setTimeout(()=>document.getElementById('authEmail').focus(),150);
}

function hideAuth(){
 authGate.classList.remove('show');
 document.getElementById('app').classList.remove('auth-locked');
 document.querySelector('.nav').classList.remove('auth-locked');

async function enterSystem(user){
 authUser=user;
 loadUserData(user.id);

 hideAuth();

 openModal('SYSTEM LINK ESTABLISHED',`<div style="text-align:center;padding:14px"><div class="label" style="color:var(--cyan)">AUTHENTICATION COMPLETE</div><div style="font-size:22px;font-weight:950;margin-top:10px">WELCOME TO SENRAI.</div><p style="margin-top:10px">Your System is ready. Your progress is now associated with your account on this device.</p><span class="system-chip" style="display:inline-block;margin-top:15px">✦ CORE SYNCHRONIZED</span></div>`);
}

async function submitAuth(e){
 e.preventDefault();
 if(!sb){
   await initializeSupabase();
   if(!sb)return authMessage('SYSTEM AUTHENTICATION IS UNAVAILABLE. CHECK YOUR CONNECTION.');
 }
 const email=document.getElementById('authEmail').value.trim();
 const pass=document.getElementById('authPassword').value;
 const confirm=document.getElementById('authConfirm').value;
 authSubmit.disabled=true;
 authMessage('CONNECTING TO SYSTEM...',true);
 try{
   if(authMode==='signup'){
     if(pass!==confirm)throw new Error('PASSWORDS DO NOT MATCH.');
     if(pass.length<6)throw new Error('PASSWORD MUST BE AT LEAST 6 CHARACTERS.');
     const r=await sb.auth.signUp({email,password:pass});
     if(r.error)throw r.error;
     if(r.data.session&&r.data.user){
       authMessage('ACCOUNT CREATED. INITIALIZING...',true);
       await enterSystem(r.data.user);
     }else{
       authMessage('ACCOUNT CREATED. CHECK YOUR EMAIL TO CONFIRM ACCESS.',true);
     }
   }else{
     const r=await sb.auth.signInWithPassword({email,password:pass});
     if(r.error)throw r.error;
     await enterSystem(r.data.user);
   }
 }catch(err){
   authMessage(err?.message||'AUTHENTICATION FAILED.');
 }finally{
   authSubmit.disabled=false;
 }
}

async function forgotPassword(){
 if(!sb){
   await initializeSupabase();
   if(!sb)return authMessage('AUTHENTICATION IS UNAVAILABLE.');
 }
 const email=document.getElementById('authEmail').value.trim();
 if(!email)return authMessage('ENTER YOUR EMAIL FIRST.');
 try{
   const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});
   if(r.error)throw r.error;
   authMessage('PASSWORD RESET EMAIL SENT.',true);
 }catch(err){
   authMessage(err?.message||'COULD NOT SEND RESET EMAIL.');
 }
}

async function signOut(){
 if(!sb)return;
 await sb.auth.signOut();
 authUser=null;
 showAuth();
 authMessage('SIGNED OUT.',true);
}

async function initializeSupabase(){
 if(sb)return sb;
 try{
   if(window.supabase?.createClient){
     sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
     supabaseReady=true;
     return sb;
   }
 }catch(e){
   sb=null;
 }
 return null;
}

async function waitForSupabase(ms=5000){
 const start=Date.now();
 while(Date.now()-start<ms){
   if(await initializeSupabase())return true;
   await new Promise(r=>setTimeout(r,100));
 }
 return false;
}

async function startAuth(){
 try{
   const ready=await waitForSupabase(7000);
   if(!ready){
     showAuth();
     authMessage('SYSTEM AUTHENTICATION IS UNAVAILABLE. TAP ENTER SYSTEM TO RETRY.');
     return;
   }

   const sessionResult=await Promise.race([
     sb.auth.getSession(),
     new Promise((_,reject)=>setTimeout(()=>reject(new Error('AUTHENTICATION TIMEOUT')),5000))
   ]);

   if(sessionResult.error)throw sessionResult.error;

   if(sessionResult.data.session?.user){
     await enterSystem(sessionResult.data.session.user);
   }else{
     showAuth();
   }

   sb.auth.onAuthStateChange((event,session)=>{
     if(event==='SIGNED_OUT'){
       authUser=null;
       showAuth();
     }else if(event==='SIGNED_IN'&&session?.user&&!authUser){
       setTimeout(()=>enterSystem(session.user),0);
     }
   });
 }catch(err){
   showAuth();
   authMessage(err?.message||'SYSTEM AUTHENTICATION FAILED.');
 }
}
