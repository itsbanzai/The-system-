<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The System</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
        }


        .system {
            width: 100%;
            max-width: 500px;

            padding: 30px 20px 60px;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }


        .status {
            color: #00e5ff;

            font-size: 13px;
            letter-spacing: 3px;
        }


        h1 {
            font-size: 36px;
            margin: 10px 0;
        }


        .level {
            color: #aaa;
            font-size: 20px;
        }


        /* =========================
           XP
        ========================= */

        .xp-text {
            display: flex;
            justify-content: space-between;

            margin-top: 25px;

            color: #aaa;
            font-size: 14px;
        }


        .xp-bar {
            width: 100%;
            height: 12px;

            margin-top: 8px;

            background: #222;

            border-radius: 20px;

            overflow: hidden;
        }


        .xp-fill {
            width: 25%;
            height: 100%;

            background: #00e5ff;

            transition:
                width 0.4s ease;
        }


        /* =========================
           SECTIONS
        ========================= */

        .section {
            margin-top: 35px;
        }


        .section-title {
            margin-bottom: 15px;

            color: #00e5ff;

            font-size: 14px;

            letter-spacing: 2px;
        }


        /* =========================
           QUEST CARD
        ========================= */

        .quest {
            background: #121212;

            border: 1px solid #292929;

            border-radius: 12px;

            padding: 18px;

            margin-bottom: 12px;
        }


        .quest-name {
            font-size: 17px;

            line-height: 1.4;
        }


        .quest-xp {
            margin-top: 8px;

            color: #00e5ff;

            font-size: 13px;
        }


        /* =========================
           BUTTONS
        ========================= */

        button {
            width: 100%;

            padding: 15px;

            margin-top: 15px;

            border: none;

            border-radius: 10px;

            background: #00e5ff;

            color: #000;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        button:active {
            transform: scale(0.98);
        }


        button.completed {
            background: #222;

            color: #777;

            cursor: default;
        }


        .surprise-button {
            background: #151515;

            border: 1px solid #444;

            color: #00e5ff;
        }


        /* =========================
           LEVEL UP
        ========================= */

        .level-up {
            display: none;

            margin-top: 15px;

            text-align: center;

            color: #00e5ff;

            font-size: 18px;

            font-weight: bold;
        }


        /* =========================
           RANDOM QUEST
        ========================= */

        .random-quest {
            min-height: 24px;
        }

    </style>

</head>



<body>


<div class="system">


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <div class="status">
            SYSTEM ONLINE
        </div>


        <h1>
            THE SYSTEM
        </h1>


        <div
            class="level"
            id="level"
        >
            LEVEL 1
        </div>

    </div>



    <!-- =========================
         XP DISPLAY
    ========================= -->

    <div class="xp-text">

        <span>
            XP
        </span>


        <span id="xpText">
            250 / 1000
        </span>

    </div>


    <div class="xp-bar">

        <div
            class="xp-fill"
            id="xpFill"
        ></div>

    </div>


    <div
        class="level-up"
        id="levelUp"
    >
        LEVEL UP!
    </div>



    <!-- =========================
         DAILY QUESTS
    ========================= -->

    <div class="section">

        <div class="section-title">
            DAILY QUESTS
        </div>


        <!-- QUEST 1 -->

        <div class="quest">

            <div class="quest-name">
                Make your bed
            </div>


            <div class="quest-xp">
                +10 XP
            </div>


            <button
                id="dailyQuest1"
                onclick="completeDailyQuest(1, 10)"
            >
                COMPLETE QUEST
            </button>

        </div>



        <!-- QUEST 2 -->

        <div class="quest">

            <div class="quest-name">
                Drink some water
            </div>


            <div class="quest-xp">
                +10 XP
            </div>


            <button
                id="dailyQuest2"
                onclick="completeDailyQuest(2, 10)"
            >
                COMPLETE QUEST
            </button>

        </div>



        <!-- QUEST 3 -->

        <div class="quest">

            <div class="quest-name">
                Do something you've been putting off
            </div>


            <div class="quest-xp">
                +25 XP
            </div>


            <button
                id="dailyQuest3"
                onclick="completeDailyQuest(3, 25)"
            >
                COMPLETE QUEST
            </button>

        </div>

    </div>



    <!-- =========================
         LIFE QUEST
    ========================= -->

    <div class="section">

        <div class="section-title">
            LIFE QUEST
        </div>


        <div class="quest">


            <div
                class="quest-name random-quest"
                id="randomQuest"
            >
                Generate a random life quest.
            </div>


            <div
                class="quest-xp"
                id="randomXP"
            >
                ??? XP
            </div>


            <button
                class="surprise-button"
                onclick="generateRandomQuest()"
            >
                🎲 SURPRISE ME
            </button>


            <button
                id="randomComplete"
                onclick="completeRandomQuest()"
                style="display: none;"
            >
                COMPLETE QUEST
            </button>


        </div>

    </div>



    <!-- =========================
         SIDE QUEST
    ========================= -->

    <div class="section">

        <div class="section-title">
            SIDE QUEST
        </div>


        <div class="quest">


            <div class="quest-name">
                Call someone you haven't talked to recently.
            </div>


            <div class="quest-xp">
                +20 XP
            </div>


            <button
                id="sideQuestButton"
                onclick="completeSideQuest()"
            >
                COMPLETE QUEST
            </button>


        </div>

    </div>


</div>



<script>


/* =====================================================
   SYSTEM DATA
===================================================== */


let level =
    Number(
        localStorage.getItem("systemLevel")
    ) || 1;


let xp =
    Number(
        localStorage.getItem("systemXP")
    );


if (isNaN(xp)) {

    xp = 250;

}


const XP_NEEDED = 1000;



/* =====================================================
   RANDOM LIFE QUESTS
===================================================== */


const lifeQuests = [

    {
        text: "Go outside for 5 minutes.",
        xp: 10
    },

    {
        text: "Text someone you haven't talked to in a while.",
        xp: 20
    },

    {
        text: "Tell someone you appreciate them.",
        xp: 20
    },

    {
        text: "Clean something you've been ignoring.",
        xp: 25
    },

    {
        text: "Learn one completely random fact.",
        xp: 10
    },

    {
        text: "Put your phone down for 20 minutes.",
        xp: 25
    },

    {
        text: "Take a photo of something you think looks cool.",
        xp: 10
    },

    {
        text: "Work on a hobby for 20 minutes.",
        xp: 25
    },

    {
        text: "Take a different route somewhere today.",
        xp: 15
    },

    {
        text: "Do something kind for someone.",
        xp: 25
    },

    {
        text: "Watch the sunset.",
        xp: 20
    },

    {
        text: "Call a family member just to say hi.",
        xp: 20
    },

    {
        text: "Organize one small area of your room.",
        xp: 15
    },

    {
        text: "Try something you've never done before.",
        xp: 50
    },

    {
        text: "Spend 20 minutes learning something new.",
        xp: 25
    },

    {
        text: "Listen to an album from beginning to end.",
        xp: 20
    },

    {
        text: "Write down one thing you're grateful for.",
        xp: 10
    },

    {
        text: "Take a short walk and notice five things around you.",
        xp: 20
    }

];



let currentRandomQuest = null;



/* =====================================================
   ELEMENTS
===================================================== */


const levelElement =
    document.getElementById("level");


const xpText =
    document.getElementById("xpText");


const xpFill =
    document.getElementById("xpFill");


const levelUp =
    document.getElementById("levelUp");


const randomQuest =
    document.getElementById("randomQuest");


const randomXP =
    document.getElementById("randomXP");


const randomComplete =
    document.getElementById("randomComplete");



/* =====================================================
   UPDATE SYSTEM
===================================================== */


function updateSystem() {


    levelElement.textContent =
        "LEVEL " + level;


    xpText.textContent =
        xp + " / " + XP_NEEDED;


    const percentage =
        (xp / XP_NEEDED) * 100;


    xpFill.style.width =
        percentage + "%";


    localStorage.setItem(
        "systemLevel",
        level
    );


    localStorage.setItem(
        "systemXP",
        xp
    );

}



/* =====================================================
   ADD XP
===================================================== */


function addXP(amount) {


    xp += amount;


    while (xp >= XP_NEEDED) {

        xp -= XP_NEEDED;

        level++;


        showLevelUp();

    }


    updateSystem();

}



/* =====================================================
   LEVEL UP
===================================================== */


function showLevelUp() {


    levelUp.style.display =
        "block";


    setTimeout(function() {

        levelUp.style.display =
            "none";

    }, 3000);

}



/* =====================================================
   DAILY QUESTS
===================================================== */


function completeDailyQuest(
    questNumber,
    amount
) {


    const storageKey =
        "dailyQuest" +
        questNumber +
        "Completed";


    const alreadyCompleted =
        localStorage.getItem(
            storageKey
        );


    if (
        alreadyCompleted === "true"
    ) {

        return;

    }


    addXP(amount);


    localStorage.setItem(
        storageKey,
        "true"
    );


    const button =
        document.getElementById(
            "dailyQuest" +
            questNumber
        );


    button.textContent =
        "COMPLETED ✓";


    button.classList.add(
        "completed"
    );


    button.disabled =
        true;

}



/* =====================================================
   SIDE QUEST
===================================================== */


function completeSideQuest() {


    const completed =
        localStorage.getItem(
            "sideQuestCompleted"
        );


    if (
        completed === "true"
    ) {

        return;

    }


    addXP(20);


    localStorage.setItem(
        "sideQuestCompleted",
        "true"
    );


    const button =
        document.getElementById(
            "sideQuestButton"
        );


    button.textContent =
        "COMPLETED ✓";


    button.classList.add(
        "completed"
    );


    button.disabled =
        true;

}



/* =====================================================
   GENERATE RANDOM QUEST
===================================================== */


function generateRandomQuest() {


    const randomIndex =
        Math.floor(
            Math.random() *
            lifeQuests.length
        );


    currentRandomQuest =
        lifeQuests[randomIndex];


    randomQuest.textContent =
        currentRandomQuest.text;


    randomXP.textContent =
        "+" +
        currentRandomQuest.xp +
        " XP";


    randomComplete.style.display =
        "block";


    randomComplete.textContent =
        "COMPLETE QUEST";


    randomComplete.classList.remove(
        "completed"
    );


    randomComplete.disabled =
        false;

}



/* =====================================================
   COMPLETE RANDOM QUEST
===================================================== */


function completeRandomQuest() {


    if (
        !currentRandomQuest
    ) {

        return;

    }


    if (
        randomComplete.disabled
    ) {

        return;

    }


    addXP(
        currentRandomQuest.xp
    );


    randomComplete.textContent =
        "COMPLETED ✓";


    randomComplete.classList.add(
        "completed"
    );


    randomComplete.disabled =
        true;

}



/* =====================================================
   LOAD SAVED QUESTS
===================================================== */


function loadSavedQuests() {


    for (
        let i = 1;
        i <= 3;
        i++
    ) {


        const completed =
            localStorage.getItem(
                "dailyQuest" +
                i +
                "Completed"
            );


        if (
            completed === "true"
        ) {


            const button =
                document.getElementById(
                    "dailyQuest" +
                    i
                );


            button.textContent =
                "COMPLETED ✓";


            button.classList.add(
                "completed"
            );


            button.disabled =
                true;

        }

    }



    const sideCompleted =
        localStorage.getItem(
            "sideQuestCompleted"
        );


    if (
        sideCompleted === "true"
    ) {


        const button =
            document.getElementById(
                "sideQuestButton"
            );


        button.textContent =
            "COMPLETED ✓";


        button.classList.add(
            "completed"
        );


        button.disabled =
            true;

    }

}



/* =====================================================
   START SYSTEM
===================================================== */


updateSystem();

loadSavedQuests();


</script>


</body>

</html>
