<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050609">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SENRAI">
<link rel="icon" type="image/png" href="senrai-logo.png">
<link rel="apple-touch-icon" href="senrai-logo.png">
<title>SENRAI — The System That Moves You Forward</title>

<style>
:root{--bg:#050609;--panel:rgba(13,16,22,.84);--panel2:#0b0e14;--line:#202632;--text:#f1f3f7;--muted:#7d8694;--dim:#555e6d;--blue:#65a9ff;--cyan:#69e2dc;--purple:#a87cff;--green:#5df2a5;--orange:#ffae57;--red:#ff667a;--gold:#f2d36b}

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
background:var(--bg);
color:var(--text);
font-family:Inter,Arial,Helvetica,sans-serif;
min-height:100vh;
overflow-x:hidden
}

button,input,select,textarea{font:inherit}

button{
border:1px solid #303744;
background:#11141a;
color:var(--text);
padding:11px 14px;
border-radius:12px;
font-size:9px;
letter-spacing:1.5px;
cursor:pointer;
transition:.2s
}

button:hover{background:#191d25;border-color:#596476}
button:disabled{opacity:.35;cursor:not-allowed}
button{position:relative;overflow:hidden}

.primary{
background:#edf2f8;
color:#050609;
border-color:#edf2f8;
font-weight:800
}

.ghost{background:transparent}
.danger{border-color:#4a2830;color:#ff8795}
.small{padding:8px 10px;font-size:8px}
.hidden{display:none!important}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
radial-gradient(circle at 50% 8%,rgba(101,169,255,.06),transparent 34%),
radial-gradient(circle at 8% 80%,rgba(168,124,255,.035),transparent 28%);
z-index:-4
}

.ambient{
position:fixed;
inset:0;
z-index:-3;
pointer-events:none;
overflow:hidden
}

.ambient i{
position:absolute;
width:2px;
height:2px;
border-radius:50%;
background:#dce6f5;
opacity:.25;
animation:float 13s linear infinite
}

.ambient i:nth-child(1){left:10%;top:72%;animation-delay:-3s}
.ambient i:nth-child(2){left:78%;top:32%;animation-delay:-8s}
.ambient i:nth-child(3){left:88%;top:78%;animation-delay:-5s}
.ambient i:nth-child(4){left:35%;top:22%;animation-delay:-11s}

.scan{
position:absolute;
top:-2px;
width:100%;
height:1px;
background:linear-gradient(90deg,transparent,rgba(105,226,220,.2),transparent);
animation:scan 13s linear infinite
}

@keyframes float{
0%{transform:translateY(40px);opacity:0}
20%{opacity:.4}
50%{transform:translate(12px,-50px);opacity:.15}
100%{transform:translate(-10px,-130px);opacity:0}
}

@keyframes scan{
0%{top:-2px;opacity:0}
10%{opacity:1}
90%{opacity:.25}
100%{top:100%;opacity:0}
}

@keyframes breathe{
0%,100%{transform:scale(.94);opacity:.7}
50%{transform:scale(1.08);opacity:1}
}

@keyframes spin{to{transform:rotate(360deg)}}

@keyframes coreFloat{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-5px)}
}

@keyframes pulse{
0%,100%{transform:scale(1)}
50%{transform:scale(1.08)}
}

@keyframes pop{
0%{transform:scale(1)}
30%{transform:scale(1.17)}
60%{transform:scale(.95)}
100%{transform:scale(1)}
}

@keyframes glow{
0%,100%{box-shadow:0 0 0 rgba(105,226,220,0)}
50%{box-shadow:0 0 35px rgba(105,226,220,.18)}
}

#splash{
position:fixed;
inset:0;
z-index:9999;
background:#030407;
display:grid;
place-items:center;
transition:.7s
}

.splash{
width:min(430px,86%);
text-align:center
}

.splash img{
width:min(260px,70vw);
max-height:160px;
object-fit:contain;
filter:drop-shadow(0 0 28px rgba(230,240,255,.1));
margin-bottom:30px
}

.splash p{
color:#737c89;
font-size:9px;
letter-spacing:3px
}

.load{
margin-top:45px;
height:2px;
background:#171b23;
border-radius:99px;
overflow:hidden
}

.load b{
display:block;
width:0;
height:100%;
background:#e8edf5;
transition:.2s
}

.load-meta{
display:flex;
justify-content:space-between;
color:#626a78;
font-size:8px;
letter-spacing:2px;
margin-top:11px
}

#app{
width:min(1080px,100%);
margin:auto;
padding:18px 14px 108px
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 4px 18px;
border-bottom:1px solid var(--line)
}

.brand{
font-size:19px;
font-weight:950;
letter-spacing:5.5px
}

.statusline{
display:flex;
align-items:center;
gap:6px;
color:#596272;
font-size:7px;
letter-spacing:1.4px;
margin-top:7px
}

.dot{
width:5px;
height:5px;
border-radius:50%;
background:var(--green);
box-shadow:0 0 8px var(--green)
}

.menu{position:relative}

.system-btn{
border-radius:99px;
padding:9px 12px
}

.menu-panel{
position:absolute;
right:0;
top:45px;
width:225px;
padding:8px;
border:1px solid var(--line);
background:#0b0e14;
border-radius:18px;
z-index:200;
box-shadow:0 20px 50px #000
}

.menu-panel button{
width:100%;
border:0;
background:transparent;
text-align:left
}

.menu-label{
color:var(--muted);
font-size:7px;
letter-spacing:2px;
padding:8px 10px
}

.view{display:none}
.view.active{display:block}

.section{margin-top:25px}

.section-head{
display:flex;
justify-content:space-between;
align-items:end;
gap:10px;
margin-bottom:11px
}

.section-title{
font-size:11px;
letter-spacing:3px;
font-weight:900
}

.desc,.label{
color:var(--muted);
font-size:8px;
letter-spacing:1.8px
}

.card,.objective,.reflection,.status,.feed,.quest,.life,.stat,.week,.achievement,.history,.profile,.settings,.path-card,.boss,.journey-card,.intel-card{
border:1px solid var(--line);
background:var(--panel);
border-radius:20px;
box-shadow:0 12px 35px rgba(0,0,0,.12)
}

.core-stage{
position:relative;
height:305px;
margin-top:22px;
border:1px solid #1b212b;
border-radius:28px;
display:grid;
place-items:center;
overflow:hidden;
background:
radial-gradient(circle at 50% 48%,rgba(101,169,255,.09),transparent 25%),
radial-gradient(circle,rgba(168,124,255,.04),transparent 55%);
box-shadow:
inset 0 0 70px rgba(0,0,0,.35),
0 20px 55px rgba(0,0,0,.12)
}

.core-stage:before{
content:"";
position:absolute;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.016) 1px,transparent 1px);
background-size:42px 42px;
mask-image:radial-gradient(circle,#000,transparent 72%)
}

.aura{
position:absolute;
width:175px;
height:175px;
border-radius:50%;
background:radial-gradient(circle,rgba(105,226,220,.14),transparent 68%);
animation:breathe 4s ease-in-out infinite
}

.orbit{
position:absolute;
border:1px dashed rgba(110,125,145,.14);
border-radius:50%;
width:225px;
height:225px
}

.o1{transform:rotateX(64deg) rotateZ(12deg)}
.o2{
width:280px;
height:175px;
transform:rotateX(67deg) rotateY(22deg)
}

.o3{
width:300px;
height:300px;
transform:rotateY(66deg) rotateZ(20deg);
border-color:rgba(168,124,255,.07)
}

.core{
width:132px;
height:132px;
border-radius:50%;
z-index:4;
display:grid;
place-items:center;
text-align:center;
background:radial-gradient(circle at 35% 25%,#26303d,#0d1118 62%,#080a0f);
border:1px solid #667284;
box-shadow:
0 0 0 8px rgba(5,6,9,.74),
0 0 0 9px #202733,
0 12px 35px rgba(0,0,0,.6),
0 0 35px rgba(105,226,220,.11);
position:relative;
animation:coreFloat 5s ease-in-out infinite;
transition:.4s
}

.core:before,.core:after{
content:"";
position:absolute;
inset:-14px;
border-radius:50%;
border:1px solid rgba(105,226,220,.14);
animation:spin 18s linear infinite
}

.core:after{
inset:-23px;
border-color:rgba(101,169,255,.08);
animation-duration:26s;
animation-direction:reverse
}

.core.awake{
border-color:var(--purple);
box-shadow:
0 0 0 8px rgba(5,6,9,.74),
0 0 0 9px #40305e,
0 12px 45px #000,
0 0 55px rgba(168,124,255,.25)
}

.core.pop{animation:pop .85s ease-out}

.symbol{
font-size:31px;
text-shadow:0 0 18px rgba(235,242,250,.55);
animation:pulse 2.8s ease-in-out infinite
}

.core small{
display:block;
color:#aab3c0;
font-size:8px;
letter-spacing:2px;
margin-top:8px
}

.core small b{color:#fff}

.core em{
display:block;
color:#657080;
font-size:7px;
font-style:normal;
letter-spacing:1.3px;
margin-top:5px
}

.node{
position:absolute;
z-index:5;
color:#667180;
font-size:7px;
letter-spacing:1.5px;
border:1px solid #242c37;
background:rgba(8,11,16,.85);
padding:7px 9px;
border-radius:99px
}

.n1{top:40px;left:18%}
.n2{right:17%;top:75px}
.n3{
bottom:45px;
left:50%;
transform:translateX(-50%)
}

.core-caption{
position:absolute;
bottom:16px;
display:flex;
gap:9px;
align-items:center;
font-size:7px;
letter-spacing:2px;
color:#5f6876
}

.core-path{
color:var(--cyan);
border:1px solid rgba(105,226,220,.18);
padding:5px 8px;
border-radius:99px;
letter-spacing:1.5px
}

.hero{
margin-top:10px;
padding:21px;
border:1px solid var(--line);
border-radius:20px;
background:var(--panel)
}

.hero-top{
display:flex;
justify-content:space-between
}

.level{
font-size:36px;
font-weight:900;
line-height:1;
margin-top:5px
}

.level span{
font-size:11px;
color:var(--muted);
letter-spacing:2px
}

.hero-xp{text-align:right}

.hero-xp strong{font-size:21px}

.hero-xp small{
display:block;
color:var(--muted);
font-size:8px;
letter-spacing:2px;
margin-top:3px
}

.track{
height:6px;
background:#181c24;
border-radius:99px;
overflow:hidden
}

.hero .track{margin-top:20px}

.fill{
height:100%;
width:0;
border-radius:99px;
background:linear-gradient(90deg,#697589,#edf2f8);
transition:.45s
}

.xp-foot{
display:flex;
justify-content:space-between;
color:var(--muted);
font-size:8px;
margin-top:8px;
letter-spacing:1px
}

.summary{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:10px
}

.summary .card{padding:15px}

.value{
font-size:22px;
font-weight:900;
margin-top:7px
}

.sub{
color:#59616f;
font-size:8px;
margin-top:4px
}

.orange{color:var(--orange)}

.status{
padding:15px 17px;
display:flex;
justify-content:space-between;
align-items:center;
gap:16px;
background:
linear-gradient(110deg,rgba(105,226,220,.035),rgba(101,169,255,.025)),
var(--panel)
}

.status-title{
font-size:16px;
font-weight:900;
margin-top:4px
}

.metrics{
display:flex;
gap:18px
}

.metrics span{
display:block;
color:#596272;
font-size:6px;
letter-spacing:1.2px
}

.metrics b{
display:block;
font-size:8px;
margin-top:4px
}

.feed-list{
display:grid;
gap:7px
}

.feed{
padding:11px 13px;
display:flex;
align-items:center;
gap:12px;
border-radius:16px
}

.feed-dot{
width:5px;
height:5px;
border-radius:50%;
background:var(--cyan);
box-shadow:0 0 10px var(--cyan)
}

.feed-main{
flex:1;
min-width:0
}

.feed-title{
font-size:9px;
font-weight:800;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.feed-meta{
font-size:7px;
color:#596272;
margin-top:3px
}

.feed-xp{
font-size:8px;
color:var(--green);
font-weight:900
}

.empty{
border:1px dashed #222a35;
border-radius:16px;
padding:16px;
color:#596272;
font-size:8px;
text-align:center;
letter-spacing:1px
}

.objective{
padding:18px;
border-left:2px solid var(--blue);
background:
radial-gradient(circle at 90% 0,rgba(101,169,255,.07),transparent 35%),
var(--panel)
}

.objective h2{
font-size:19px;
margin:8px 0
}

.objective p,.reflection p,.quest p,.life p,.week p,.history p,.boss p,.journey-card p,.intel-card p{
color:#aeb5c1;
font-size:10px;
line-height:1.55
}

.objective:after{
content:"SYSTEM ASSIGNED";
display:block;
color:#424b58;
font-size:6px;
letter-spacing:2px;
margin-top:15px
}

.meta{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
color:var(--muted);
font-size:8px;
margin-top:9px
}

.reflection{
padding:20px;
position:relative;
overflow:hidden;
background:
radial-gradient(circle at 90% 0,rgba(101,169,255,.1),transparent 38%),
var(--panel)
}

.reflection:before{
content:"";
position:absolute;
left:0;
top:0;
bottom:0;
width:2px;
background:linear-gradient(180deg,var(--blue),var(--purple))
}

.reflection-title{
font-size:18px;
font-weight:900;
line-height:1.35;
margin:8px 0
}

.divider{
height:1px;
background:#1d232d;
margin:16px 0
}

.recommend{
font-size:13px;
font-weight:800;
margin-top:6px
}

.reward-text{
color:var(--green);
font-size:8px;
letter-spacing:1px;
margin-top:5px
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:14px
}

.actions button{
width:100%;
height:46px;
min-width:0;
margin:0
}

.actions button.tap-fx{animation:senraiTap .28s ease-out}

.actions button.tap-fx:after{
content:"";
position:absolute;
inset:0;
border:1px solid var(--cyan);
border-radius:inherit;
opacity:0;
animation:tapRing .38s ease-out;
pointer-events:none
}

@keyframes senraiTap{
0%{transform:scale(1)}
35%{transform:scale(.965);filter:brightness(1.25)}
100%{transform:scale(1);filter:none}
}

@keyframes tapRing{
0%{opacity:.7;transform:scale(.92)}
100%{opacity:0;transform:scale(1.08)}
}

.life-actions,.boss-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:15px
}

.life-actions button,.boss-actions button{
width:100%;
height:46px;
min-width:0;
margin:0
}

.life-actions button.tap-fx,.boss-actions button.tap-fx{
animation:senraiTap .28s ease-out
}

.path-card{padding:18px}

.path-head{
display:flex;
justify-content:space-between;
gap:10px
}

.path-name{
font-size:19px;
font-weight:900;
margin-top:6px
}

.path-desc{
color:var(--muted);
font-size:9px;
line-height:1.5;
margin-top:5px
}

.chip,.pill{
border:1px solid #2b313c;
color:var(--muted);
border-radius:99px;
padding:5px 8px;
font-size:7px;
letter-spacing:1px
}

.system-chip{
border:1px solid rgba(105,226,220,.2);
color:var(--cyan);
padding:6px 9px;
border-radius:99px;
font-size:7px;
letter-spacing:1.5px
}

.path-tags{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:12px
}

.stage-list{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:6px;
margin-top:16px
}

.stage{
border:1px solid #202733;
border-radius:12px;
padding:9px 6px;
text-align:center;
background:#0a0d12;
min-width:0
}

.stage .mark{
font-size:15px;
color:#566070
}

.stage strong{
display:block;
font-size:7px;
letter-spacing:1px;
margin-top:5px
}

.stage small{
display:block;
color:#555e6d;
font-size:6px;
margin-top:3px
}

.stage.current{
border-color:rgba(105,226,220,.4);
box-shadow:0 0 20px rgba(105,226,220,.06)
}

.stage.current .mark{color:var(--cyan)}
.stage.done .mark{color:var(--green)}

.quest-list{
display:grid;
gap:8px
}

.quest{
padding:14px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px
}

.quest-main{
min-width:0
}

.quest h3{
font-size:11px;
font-weight:800
}

.quest.complete{opacity:.4}

.quest.complete h3{text-decoration:line-through}

.pills{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-top:7px
}

.pill.xp{color:var(--green)}

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}

.form-group{
display:flex;
flex-direction:column;
gap:6px
}

.form-group.full{grid-column:1/-1}

.form-group label{
color:var(--muted);
font-size:8px;
letter-spacing:1.5px
}

input,select,textarea{
width:100%;
border:1px solid #2a303b;
background:#0a0d12;
color:var(--text);
border-radius:12px;
padding:11px 12px;
font-size:10px;
outline:none
}

textarea{
min-height:90px;
resize:vertical
}

input:focus,select:focus,textarea:focus{
border-color:#66758a
}

.life{
padding:20px;
background:
radial-gradient(circle at 90% 0,rgba(255,174,87,.07),transparent 35%),
var(--panel)
}

.life-label{
color:var(--orange);
font-size:8px;
letter-spacing:2px
}

.life-title{
font-size:20px;
font-weight:900;
margin:8px 0
}

.life-actions{
display:flex;
gap:8px;
margin-top:15px
}

.life-actions button{flex:1}

.stats-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.stat{padding:16px}

.stat-top{
display:flex;
justify-content:space-between
}

.stat-name{
font-size:11px;
font-weight:900
}

.stat-value{
font-size:17px;
font-weight:900
}

.stat-note{
font-size:8px;
color:var(--muted);
margin:4px 0 10px
}

.stat-track{
height:5px;
background:#181c24;
border-radius:99px;
overflow:hidden
}

.stat-fill{
height:100%;
border-radius:99px
}

.str{background:var(--red)}
.int{background:var(--blue)}
.wis{background:var(--purple)}
.cha{background:var(--orange)}
.dex{background:var(--cyan)}
.cre{background:#e98bff}
.vit{background:var(--green)}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.week{padding:17px}

.week-top{
display:flex;
justify-content:space-between;
gap:10px
}

.week-title{
font-size:12px;
font-weight:900
}

.week-xp{
color:var(--green);
font-size:8px;
letter-spacing:1px
}

.week p{
color:var(--muted);
font-size:9px;
margin:7px 0 12px
}

.achievement-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.achievement{
padding:16px;
position:relative
}

.achievement.locked{opacity:.42}

.achievement-icon{font-size:22px}

.achievement-title{
font-size:11px;
font-weight:900;
margin-top:8px
}

.achievement-desc{
color:var(--muted);
font-size:8px;
line-height:1.45;
margin-top:5px
}

.achievement-reward{
color:var(--green);
font-size:8px;
margin-top:9px
}

.history-list{
display:grid;
gap:8px
}

.history{
padding:13px;
display:flex;
justify-content:space-between;
gap:10px
}

.history-title{
font-size:10px;
font-weight:800
}

.history-meta{
color:var(--muted);
font-size:7px;
margin-top:4px
}

.history-xp{
color:var(--green);
font-size:9px;
font-weight:800;
white-space:nowrap
}

.moment-box{
border:1px solid var(--line);
background:var(--panel);
border-radius:20px;
padding:18px
}

.moment-list{
display:grid;
gap:8px;

const defaultData=()=>({
version:4,
createdAt:new Date().toISOString(),
level:1,
xp:0,
stats:{
STR:0,
INT:0,
WIS:0,
CHA:0,
DEX:0,
CRE:0,
VIT:0
},
actions:[],
custom:[],
moments:[],
objectives:[],
activeLife:null,
weekly:{},
achievements:[],
titles:[],
seen:[],
guidance:true,
motion:true,
notifications:false,
streak:0,
lastActive:null,
path:{
name:'INITIATE',
stage:0
},
boss:null,
bossHistory:[],
journey:[],
awakening:false,
reflectionIndex:0
});

let d=defaultData();

function uid(){
return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function todayKey(date=new Date()){
return date.toISOString().slice(0,10);
}

function esc(v){
return String(v??'')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');
}

function save(){
try{
localStorage.setItem(KEY,JSON.stringify(d));
}catch(e){
console.warn('SENRAI save failed',e);
}
}

function load(){
try{
const raw=localStorage.getItem(KEY);
if(raw){
const parsed=JSON.parse(raw);
d=Object.assign(defaultData(),parsed);
d.stats=Object.assign(defaultData().stats,parsed.stats||{});
d.path=Object.assign(defaultData().path,parsed.path||{});
}
}catch(e){
console.warn('SENRAI load failed',e);
d=defaultData();
}
}

function loadUserData(userId){
KEY='senrai_next_v1_'+userId;
load();
}

function ensureDay(){
const today=todayKey();

if(d.lastActive===today)return;

if(!d.lastActive){
d.streak=0;
d.lastActive=today;
save();
return;
}

const last=new Date(d.lastActive+'T00:00:00');
const now=new Date(today+'T00:00:00');
const diff=Math.round((now-last)/86400000);

if(diff===1){
d.streak=(d.streak||0)+1;
}else if(diff>1){
d.streak=0;
}

d.lastActive=today;
save();
}

function xpForLevel(level){
return 100+(level-1)*50;
}

function totalXPForLevel(level){
let total=0;
for(let i=1;i<level;i++)total+=xpForLevel(i);
return total;
}

function currentLevelFromXP(xp){
let level=1;
let remaining=xp;

while(remaining>=xpForLevel(level)){
remaining-=xpForLevel(level);
level++;
}

return{
level,
remaining,
needed:xpForLevel(level)
};
}

function refreshLevel(){
const before=d.level;
const info=currentLevelFromXP(d.xp);

d.level=info.level;

if(d.level>before){
for(let i=before+1;i<=d.level;i++){
setTimeout(()=>levelUp(i),(i-before-1)*500);
}
}

return info;
}

function actionToday(){
const key=todayKey();
return d.actions.filter(x=>x.date.slice(0,10)===key);
}

function todayXP(){
return actionToday().reduce((a,b)=>a+(b.xp||0),0);
}

function momentum(){
const recent=d.actions.slice(-10);
if(!recent.length)return 0;

const days=new Set(
recent.map(x=>x.date.slice(0,10))
);

return Math.min(100,Math.round(
recent.length*7+
days.size*5+
(d.streak||0)*4
));
}

function statAverage(){
const vals=Object.values(d.stats);
if(!vals.length)return 0;
return vals.reduce((a,b)=>a+b,0)/vals.length;
}

function reward(name,xp,stat,type='QUEST',id=null){
if(id && d.actions.some(x=>x.id===id))return;

const date=new Date().toISOString();

d.xp+=xp;

if(stat && d.stats[stat]!==undefined){
d.stats[stat]+=xp;
}

d.actions.push({
id:id||uid(),
name,
xp,
stat,
type,
date
});

refreshLevel();

if(type==='LIFE'){
d.weekly.life=(d.weekly.life||0)+1;
}

save();
updateLearning();
updatePath(true);
checkAchievements();

floatXP(xp);
toast('+'+xp+' XP');

render();

setTimeout(systemEvent,250);
}

function updateLearning(){
const actions=d.actions||[];

if(actions.length<3){
document.getElementById('intelTitle').textContent='No pattern established yet.';
document.getElementById('intelText').textContent='Complete a few actions and SENRAI will begin recognizing what naturally pulls you forward.';
document.getElementById('intelFavorite').textContent='—';
document.getElementById('intelWeak').textContent='—';
document.getElementById('intelRoutine').textContent='—';
document.getElementById('intelInsight').textContent='Your behavior will become the data behind your System.';
return;
}

const counts={};

actions.forEach(a=>{
counts[a.type]=(counts[a.type]||0)+1;
});

const favorite=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0]||'QUEST';

const statEntries=Object.entries(d.stats).sort((a,b)=>a[1]-b[1]);
const weak=statEntries[0]?.[0]||'—';

const activeDays=new Set(actions.map(a=>a.date.slice(0,10))).size;

document.getElementById('intelTitle').textContent=
favorite==='LIFE'
?'You respond well to experience.'
:favorite==='CUSTOM'
?'You naturally take ownership.'
:'Your actions are beginning to form a pattern.';

document.getElementById('intelText').textContent=
`SENRAI is learning from ${actions.length} recorded actions. The strongest signal currently comes from ${favorite.toLowerCase()} activity.`;

document.getElementById('intelFavorite').textContent=favorite;
document.getElementById('intelWeak').textContent=STAT_NAMES[weak]||weak;
document.getElementById('intelRoutine').textContent=
activeDays>=7?'CONSISTENT':
activeDays>=3?'FORMING':
'EMERGING';

document.getElementById('intelInsight').textContent=
activeDays>=7
?'Your behavior is becoming consistent enough for SENRAI to make stronger recommendations.'
:'Keep taking different kinds of actions. Variety helps SENRAI understand you.';
}

function pathScore(){
const scores={
BUILDER:(d.stats.CRE||0)+(d.stats.DEX||0)+(d.stats.STR||0),
CONNECTOR:d.stats.CHA||0,
SEEKER:(d.stats.INT||0)+(d.stats.WIS||0),
DISCIPLINED:(d.streak||0)*25+(d.stats.STR||0),
EXPLORER:(d.weekly.life||0)*35+(d.stats.DEX||0)+(d.stats.WIS||0)
};

return scores;
}

function updatePath(trigger=true){
const scores=pathScore();

if(!Object.keys(scores).length)return;

const best=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];

if(!best || best[1]<30){
d.path={name:'INITIATE',stage:Math.min(2,Math.floor((d.actions.length||0)/3))};
return;
}

const name=best[0];
const stage=Math.min(4,Math.floor(best[1]/75));

const changed=d.path.name!==name || d.path.stage!==stage;

d.path={
name,
stage
};

if(changed&&trigger&&stage>=2){
recordJourney('PATH EMERGED',name,`Your recent behavior is leaning toward the ${name} Path.`);
}
}

function renderJourney(){
const el=document.getElementById('journeyTimeline');

const events=[
...journeySeed(),
...(d.journey||[])
].sort(
(a,b)=>new Date(a.date)-new Date(b.date)
);

if(!events.length){
el.innerHTML=
'<div class="journey-empty">YOUR STORY HAS NOT STARTED YET.</div>';
return;
}

const unique=[];
const keys=new Set();

events.forEach(e=>{
const k=e.title+'|'+e.type;

if(!keys.has(k)){
keys.add(k);
unique.push(e);
}
});

el.innerHTML=unique.map(e=>`

</div>

</div>
</div>
`).join('');
}

authSubmit.disabled=true;

authMessage(
'CONNECTING TO SYSTEM...',
true
);

try{
await ensureSupabase();

const email=
document.getElementById('authEmail')
.value.trim();

const pass=
document.getElementById('authPassword')
.value;

const confirm=
document.getElementById('authConfirm')
.value;

if(authMode==='signup'){

if(pass!==confirm)
throw new Error(
'PASSWORDS DO NOT MATCH.'
);

const r=await withTimeout(
sb.auth.signUp({
email,
password:pass
}),
9000
);

if(r.error)
throw r.error;

if(r.data.session&&r.data.user){

authMessage(
'ACCOUNT CREATED. INITIALIZING...',
true
);

await enterSystem(
r.data.user
);

}else{

authMessage(
'ACCOUNT CREATED. CHECK YOUR EMAIL TO CONFIRM ACCESS.',
true
);

}

}else{

const r=await withTimeout(
sb.auth.signInWithPassword({
email,
password:pass
}),
9000
);

if(r.error)
throw r.error;

await enterSystem(
r.data.user
);
}

}catch(err){

authMessage(
err?.message||
'AUTHENTICATION FAILED.'
);

}finally{

authSubmit.disabled=false;

}
}

const withTimeout=
(promise,ms=5000)=>
Promise.race([
promise,
new Promise((_,rej)=>
setTimeout(
()=>rej(
new Error(
'AUTHENTICATION TIMEOUT'
)
),
ms
)
)
]);

function loadSupabase(){
return new Promise(
(resolve,reject)=>{
if(window.supabase?.createClient)
return resolve(window.supabase);

let done=false;

let timer=setTimeout(
()=>{
if(!done){
done=true;
reject(
new Error(
'AUTHENTICATION SERVICE DID NOT LOAD'
)
);
}
},
9000
);

const tryScript=(src,next)=>{
const s=document.createElement('script');

s.src=src;
s.async=true;

s.onload=()=>{
if(window.supabase?.createClient){

clearTimeout(timer);
done=true;
resolve(window.supabase);

}else if(next){

next();

}else{

clearTimeout(timer);
done=true;

reject(
new Error(
'AUTHENTICATION LIBRARY FAILED TO INITIALIZE'
)
);

}
};

s.onerror=()=>next
?next()
:(
clearTimeout(timer),
done=true,
reject(
new Error(
'AUTHENTICATION SERVICE UNAVAILABLE'
)
)
);

document.head.appendChild(s);
};

tryScript(
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
()=>tryScript(
'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'
)
);
}
);
}

function initAmbientParticles(){
  const layer=document.getElementById('ambientParticles');
  if(!layer || window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const count=window.innerWidth<700?18:30;
  for(let i=0;i<count;i++){
    const p=document.createElement('span');
    p.className='ambient-particle';
    p.style.left=(Math.random()*100)+'%';
    p.style.top=(Math.random()*105)+'%';
    p.style.setProperty('--dur',(7+Math.random()*10)+'s');
    p.style.setProperty('--drift',(-25+Math.random()*50)+'px');
    p.style.setProperty('--op',(0.18+Math.random()*0.38).toFixed(2));
    p.style.animationDelay=(-Math.random()*12)+'s';
    layer.appendChild(p);
  }
}
