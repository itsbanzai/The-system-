<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        .system {
            width: 100%;
            max-width: 500px;
            padding: 30px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .status {
            color: #00e5ff;
            font-size: 14px;
            letter-spacing: 3px;
        }

        h1 {
            font-size: 36px;
            margin: 10px 0;
        }

        .level {
            font-size: 20px;
            color: #aaa;
        }

        .xp-text {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 14px;
            color: #aaa;
        }

        .xp-bar {
            width: 100%;
            height: 12px;
            background: #222;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 8px;
        }

        .xp-fill {
            width: 25%;
            height: 100%;
            background: #00e5ff;
        }

        .section {
            margin-top: 35px;
        }

        .section-title {
            color: #00e5ff;
            letter-spacing: 2px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .quest {
            background: #121212;
            border: 1px solid #292929;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .quest-name {
            font-size: 17px;
        }

        .quest-xp {
            color: #00e5ff;
            font-size: 13px;
            margin-top: 8px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #00e5ff;
            color: black;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="system">

    <div class="header">
        <div class="status">SYSTEM ONLINE</div>

        <h1>THE SYSTEM</h1>

        <div class="level">
            LEVEL 1
        </div>
    </div>

    <div class="xp-text">
        <span>XP</span>
        <span>250 / 1000</span>
    </div>

    <div class="xp-bar">
        <div class="xp-fill"></div>
    </div>

    <div class="section">

        <div class="section-title">
            DAILY QUESTS
        </div>

        <div class="quest">
            <div class="quest-name">
                Make your bed
            </div>

            <div class="quest-xp">
                +10 XP
            </div>
        </div>

        <div class="quest">
            <div class="quest-name">
                Drink some water
            </div>

            <div class="quest-xp">
                +10 XP
            </div>
        </div>

        <div class="quest">
            <div class="quest-name">
                Do something you've been putting off
            </div>

            <div class="quest-xp">
                +25 XP
            </div>
        </div>

    </div>

    <div class="section">

        <div class="section-title">
            SIDE QUEST
        </div>

        <div class="quest">
            <div class="quest-name">
                Call someone you haven't talked to recently.
            </div>

            <div class="quest-xp">
                +20 XP
            </div>

            <button>
                COMPLETE QUEST
            </button>
        </div>

    </div>

</div>

</body>
</html>
