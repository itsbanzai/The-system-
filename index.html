<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SENRAI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #050505;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }


        /* =========================================================
           SENRAI SPLASH SCREEN
        ========================================================= */

        #splashScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;

            background:
                radial-gradient(
                    circle at center,
                    #111111 0%,
                    #070707 45%,
                    #020202 100%
                );

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            opacity: 1;
            visibility: visible;

            transition:
                opacity 1s ease,
                visibility 1s ease;
        }


        #splashScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }


        /* Background grid */

        .splash-grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;

            mask-image:
                radial-gradient(
                    ellipse at center,
                    black 0%,
                    transparent 75%
                );
        }


        .splash-content {
            position: relative;

            width: 90%;
            max-width: 500px;

            text-align: center;

            animation:
                splashAppear 1.2s ease forwards;
        }


        @keyframes splashAppear {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* Logo */

        .senrai-logo {

            width: 90px;
            height: 90px;

            margin: 0 auto 30px;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #444;

            transform: rotate(45deg);

            box-shadow:
                0 0 30px rgba(255,255,255,0.04);

            animation:
                logoPulse 2.5s ease-in-out infinite;
        }


        .senrai-logo::before {

            content: "";

            position: absolute;

            width: 45px;
            height: 45px;

            border: 2px solid #ffffff;

            transform: rotate(-45deg);

            opacity: 0.9;
        }


        .senrai-logo::after {

            content: "S";

            position: absolute;

            font-size: 30px;
            font-weight: 900;

            letter-spacing: 0;

            transform: rotate(-45deg);

            color: #ffffff;
        }


        @keyframes logoPulse {

            0%,
            100% {
                box-shadow:
                    0 0 20px rgba(255,255,255,0.03);
            }

            50% {
                box-shadow:
                    0 0 45px rgba(255,255,255,0.10);
            }

        }


        .splash-brand {

            font-size: 48px;
            font-weight: 900;

            letter-spacing: 12px;

            margin-left: 12px;

            text-shadow:
                0 0 25px rgba(255,255,255,0.08);
        }


        .splash-subtitle {

            margin-top: 12px;

            color: #666;

            font-size: 11px;

            letter-spacing: 4px;
        }


        /* Loading section */

        .loading-area {

            margin-top: 55px;
        }


        .loading-text {

            display: flex;

            justify-content: space-between;

            margin-bottom: 9px;

            color: #666;

            font-size: 10px;

            letter-spacing: 2px;
        }


        .loading-bar {

            width: 100%;
            height: 2px;

            background: #1a1a1a;

            overflow: hidden;
        }


        .loading-fill {

            width: 0%;

            height: 100%;

            background: #ffffff;

            box-shadow:
                0 0 12px rgba(255,255,255,0.5);

            animation:
                loadingProgress 2.8s cubic-bezier(
                    0.65,
                    0,
                    0.35,
                    1
                )
                forwards;
        }


        @keyframes loadingProgress {

            0% {
                width: 0%;
            }

            25% {
                width: 28%;
            }

            55% {
                width: 62%;
            }

            80% {
                width: 84%;
            }

            100% {
                width: 100%;
            }

        }


        .system-status {

            margin-top: 18px;

            font-size: 10px;

            color: #444;

            letter-spacing: 2px;
        }


        .status-dot {

            display: inline-block;

            width: 5px;
            height: 5px;

            margin-right: 7px;

            border-radius: 50%;

            background: #ffffff;

            box-shadow:
                0 0 8px rgba(255,255,255,0.7);

            animation:
                statusBlink 0.8s infinite;
        }


        @keyframes statusBlink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }

        }


        /* =========================================================
           MAIN APP
        ========================================================= */

        #app {

            opacity: 0;

            transition:
                opacity 1s ease;
        }


        #app.visible {

            opacity: 1;
        }


        .container {

            width: 100%;
            max-width: 900px;

            margin: auto;

            padding: 20px;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .system-header {

            text-align: center;

            padding: 30px 20px;

            border: 1px solid #333;

            background:
                linear-gradient(
                    180deg,
                    #101010,
                    #070707
                );

            box-shadow:
                0 0 30px rgba(255,255,255,0.03);

            margin-bottom: 20px;
        }


        .online {

            color: #00ff88;

            font-size: 12px;

            letter-spacing: 3px;

            margin-bottom: 10px;
        }


        .title {

            font-size: 42px;

            font-weight: 900;

            letter-spacing: 8px;

            margin: 0;
        }


        .subtitle {

            color: #888;

            margin-top: 10px;

            font-size: 14px;
        }


        /* =========================================================
           LEVEL
        ========================================================= */

        .level-card {

            border: 1px solid #333;

            padding: 20px;

            margin-bottom: 20px;

            background: #0b0b0b;
        }


        .level-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 12px;
        }


        .level {

            font-size: 24px;

            font-weight: bold;
        }


        .xp-text {

            color: #aaa;

            font-size: 14px;
        }


        .xp-bar {

            width: 100%;

            height: 12px;

            background: #222;

            overflow: hidden;
        }


        .xp-fill {

            height: 100%;

            width: 0%;

            background: #ffffff;

            transition:
                width 0.4s ease;
        }


        /* =========================================================
           DASHBOARD
        ========================================================= */

        .dashboard {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-bottom: 20px;
        }


        .dashboard-card {

            border: 1px solid #333;

            background: #0b0b0b;

            padding: 20px;

            text-align: center;
        }


        .dashboard-label {

            color: #777;

            font-size: 11px;

            letter-spacing: 2px;

            margin-bottom: 8px;
        }


        .dashboard-value {

            font-size: 24px;

            font-weight: bold;
        }


        /* =========================================================
           SECTIONS
        ========================================================= */

        .section {

            margin-bottom: 25px;
        }


        .section-title {

            font-size: 13px;

            letter-spacing: 3px;

            color: #888;

            border-bottom: 1px solid #222;

            padding-bottom: 10px;

            margin-bottom: 12px;
        }


        /* =========================================================
           QUESTS
        ========================================================= */

        .quest {

            border: 1px solid #292929;

            background: #0c0c0c;

            padding: 18px;

            margin-bottom: 10px;

            transition:
                0.2s;
        }


        .quest:hover {

            border-color: #555;
        }


        .quest-top {

            display: flex;

            justify-content: space-between;

            gap: 15px;
        }


        .quest-name {

            font-size: 16px;

            font-weight: bold;
        }


        .quest-description {

            color: #777;

            font-size: 12px;

            margin-top: 6px;
        }


        .xp-reward {

            color: #00ff88;

            font-weight: bold;

            white-space: nowrap;
        }


        .quest-button {

            width: 100%;

            margin-top: 15px;

            padding: 12px;

            border: 1px solid #444;

            background: #151515;

            color: white;

            cursor: pointer;

            font-weight: bold;

            letter-spacing: 1px;

            transition:
                0.2s ease;
        }


        .quest-button:hover {

            background: #222;
        }


        .quest-button.completed {

            background: #0d2b1d;

            color: #00ff88;

            border-color: #00ff88;

            cursor: default;
        }


        /* =========================================================
           LIFE QUEST
        ========================================================= */

        .surprise-box {

            border: 1px solid #333;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #101010,
                    #080808
                );

            text-align: center;
        }


        .surprise-quest {

            min-height: 45px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #ddd;

            margin-bottom: 15px;

            font-size: 15px;
        }


        .surprise-button {

            width: 100%;

            padding: 14px;

            border: 1px solid #555;

            background: #171717;

            color: white;

            font-weight: bold;

            cursor: pointer;

            letter-spacing: 2px;

            transition:
                0.2s ease;
        }


        .surprise-button:hover {

            background: #252525;
        }


        /* =========================================================
           STATS
        ========================================================= */

        .stats-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;
        }


        .stat {

            border: 1px solid #292929;

            background: #0c0c0c;

            padding: 15px;
        }


        .stat-header {

            display: flex;

            justify-content: space-between;

            margin-bottom: 8px;
        }


        .stat-name {

            font-size: 13px;

            font-weight: bold;
        }


        .stat-value {

            color: #aaa;

            font-size: 13px;
        }


        .stat-bar {

            height: 6px;

            background: #222;
        }


        .stat-fill {

            height: 100%;

            width: 0%;

            background: #ffffff;

            transition:
                width 0.3s;
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        .system-info {

            text-align: center;

            color: #555;

            font-size: 11px;

            margin-top: 30px;

            padding-bottom: 20px;
        }


        /* =========================================================
           LEVEL UP
        ========================================================= */

        .level-up {

            position: fixed;

            top: 20px;

            left: 50%;

            transform:
                translateX(-50%)
                translateY(-120px);

            background: #ffffff;

            color: #000000;

            padding: 15px 25px;

            font-weight: bold;

            letter-spacing: 2px;

            transition:
                0.4s ease;

            z-index: 999;
        }


        .level-up.show {

            transform:
                translateX(-50%)
                translateY(0);
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            .container {

                padding: 12px;
            }


            .title {

                font-size: 32px;

                letter-spacing: 6px;
            }


            .dashboard {

                grid-template-columns: 1fr;
            }


            .stats-grid {

                grid-template-columns: 1fr;
            }


            .quest-top {

                flex-direction: column;

                gap: 8px;
            }


            .splash-brand {

                font-size: 36px;

                letter-spacing: 8px;

                margin-left: 8px;
            }


            .senrai-logo {

                width: 75px;
                height: 75px;
            }

        }

    </style>
</head>


<body>
