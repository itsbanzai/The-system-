<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        .system {
            width: 100%;
            max-width: 500px;
            padding: 30px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .status {
            color: #00e5ff;
            font-size: 14px;
            letter-spacing: 3px;
        }

        h1 {
            font-size: 36px;
            margin: 10px 0;
        }

        .level {
            font-size: 20px;
            color: #aaa;
        }

        .xp-text {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 14px;
            color: #aaa;
        }

        .xp-bar {
            width: 100%;
            height: 12px;
            background: #222;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 8px;
        }

        .xp-fill {
            width: 25%;
            height: 100%;
            background: #00e5ff;
            transition: width 0.4s ease;
        }

        .section {
            margin-top: 35px;
        }

        .section-title {
            color: #00e5ff;
            letter-spacing: 2px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .quest {
            background: #121212;
            border: 1px solid #292929;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .quest-name {
            font-size: 17px;
        }

        .quest-xp {
            color: #00e5ff;
            font-size: 13px;
            margin-top: 8px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #00e5ff;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        button.completed {
            background: #222;
            color: #777;
            cursor: default;
        }

        .level-up {
            text-align: center;
            color: #00e5ff;
            font-weight: bold;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>

<div class="system">

    <div class="header">

        <div class="status">
            SYSTEM ONLINE
        </div>

        <h1>THE SYSTEM</h1>

        <div class="level" id="level">
            LEVEL 1
        </div>

    </div>

    <div class="xp-text">
        <span>XP</span>

        <span id="xpText">
            250 / 1000
        </span>
    </div>

    <div class="xp-bar">
        <div class="xp-fill" id="xpFill"></div>
    </div>

    <div class="level-up" id="levelUp">
        LEVEL UP!
    </div>


    <div class="section">

        <div class="section-title">
            DAILY QUESTS
        </div>


        <div class="quest">

            <div class="quest-name">
                Make your bed
            </div>

            <div class="quest-xp">
                +10 XP
            </div>

        </div>


        <div class="quest">

            <div class="quest-name">
                Drink some water
            </div>

            <div class="quest-xp">
                +10 XP
            </div>

        </div>


        <div class="quest">

            <div class="quest-name">
                Do something you've been putting off
            </div>

            <div class="quest-xp">
                +25 XP
            </div>

        </div>

    </div>


    <div class="section">

        <div class="section-title">
            SIDE QUEST
        </div>


        <div class="quest">

            <div class="quest-name">
                Call someone you haven't talked to recently.
            </div>

            <div class="quest-xp">
                +20 XP
            </div>

            <button id="completeButton" onclick="completeQuest()">
                COMPLETE QUEST
            </button>

        </div>

    </div>

</div>


<script>

    let level = Number(localStorage.getItem("systemLevel")) || 1;

    let xp = Number(localStorage.getItem("systemXP"));

    if (isNaN(xp)) {
        xp = 250;
    }

    let questCompleted =
        localStorage.getItem("sideQuestCompleted") === "true";


    const xpNeeded = 1000;
    const questXP = 20;


    const levelElement =
        document.getElementById("level");

    const xpText =
        document.getElementById("xpText");

    const xpFill =
        document.getElementById("xpFill");

    const button =
        document.getElementById("completeButton");

    const levelUp =
        document.getElementById("levelUp");


    function updateSystem() {

        levelElement.textContent =
            "LEVEL " + level;

        xpText.textContent =
            xp + " / " + xpNeeded;

        let percentage =
            (xp / xpNeeded) * 100;

        xpFill.style.width =
            percentage + "%";


        if (questCompleted) {

            button.textContent =
                "QUEST COMPLETE";

            button.classList.add("completed");

            button.disabled = true;

        }

        localStorage.setItem(
            "systemLevel",
            level
        );

        localStorage.setItem(
            "systemXP",
            xp
        );

        localStorage.setItem(
            "sideQuestCompleted",
            questCompleted
        );
    }


    function completeQuest() {

        if (questCompleted) {
            return;
        }


        xp += questXP;

        questCompleted = true;


        if (xp >= xpNeeded) {

            xp -= xpNeeded;

            level++;

            levelUp.style.display =
                "block";

            setTimeout(function() {

                levelUp.style.display =
                    "none";

            }, 3000);
        }


        updateSystem();
    }


    updateSystem();

</script>

</body>
</html>
