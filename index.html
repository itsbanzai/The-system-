<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>SENRAI</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #050505;
    --panel: #0b0b0b;
    --panel2: #101010;
    --border: #222;
    --border2: #2d2d2d;
    --text: #f2f2f2;
    --muted: #858585;
    --dim: #555;
    --accent: #ffffff;
    --success: #72e6a5;
    --warning: #e7c66b;
    --danger: #e47777;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
}

body {
    overflow-x: hidden;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* =========================================================
   SPLASH
========================================================= */

#splash {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: opacity .8s ease, visibility .8s ease;
}

#splash.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.splash-smoke,
.splash-smoke::before,
.splash-smoke::after {
    position: absolute;
    content: "";
    border-radius: 50%;
    pointer-events: none;
}

.splash-smoke {
    width: 75vw;
    height: 75vw;
    max-width: 650px;
    max-height: 650px;
    background: radial-gradient(
        circle,
        rgba(255,255,255,.075) 0%,
        rgba(255,255,255,.035) 25%,
        rgba(255,255,255,.012) 48%,
        transparent 72%
    );
    filter: blur(30px);
    animation: smokeFloat 9s ease-in-out infinite alternate;
}

.splash-smoke::before {
    width: 55%;
    height: 55%;
    left: -20%;
    top: 20%;
    background: rgba(255,255,255,.035);
    filter: blur(40px);
    animation: smokeLeft 7s ease-in-out infinite alternate;
}

.splash-smoke::after {
    width: 55%;
    height: 55%;
    right: -20%;
    bottom: 10%;
    background: rgba(255,255,255,.035);
    filter: blur(40px);
    animation: smokeRight 8s ease-in-out infinite alternate;
}

.splash-content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    padding: 30px;
    text-align: center;
}

.splash-logo {
    width: 155px;
    height: 155px;
    object-fit: contain;
    filter:
        drop-shadow(0 0 10px rgba(255,255,255,.18))
        drop-shadow(0 0 35px rgba(255,255,255,.08));
    animation: logoAwaken 3s ease-in-out infinite alternate;
}

.splash-status {
    margin-top: 26px;
    font-size: 10px;
    letter-spacing: 4px;
    color: #aaa;
}

.splash-progress {
    width: 180px;
    height: 2px;
    margin: 18px auto 0;
    background: #1b1b1b;
    overflow: hidden;
}

.splash-progress-bar {
    height: 100%;
    width: 0%;
    background: #ddd;
    box-shadow: 0 0 10px rgba(255,255,255,.4);
}

.splash-percent {
    margin-top: 10px;
    color: #555;
    font-size: 9px;
    letter-spacing: 2px;
}

@keyframes smokeFloat {
    from {
        transform: translate(-6%, -3%) scale(.95);
    }
    to {
        transform: translate(6%, 4%) scale(1.08);
    }
}

@keyframes smokeLeft {
    from {
        transform: translate(0, 10%) scale(.9);
    }
    to {
        transform: translate(35%, -15%) scale(1.15);
    }
}

@keyframes smokeRight {
    from {
        transform: translate(0, 0) scale(.9);
    }
    to {
        transform: translate(-30%, 20%) scale(1.15);
    }
}

@keyframes logoAwaken {
    from {
        opacity: .72;
        transform: scale(.97);
    }
    to {
        opacity: 1;
        transform: scale(1.02);
    }
}

/* =========================================================
   APP
========================================================= */

#app {

}

.topbar {

/* =========================================================
   MODAL
========================================================= */

        grid-template-columns: repeat(4, 1fr);
    }
}

</head>

/* =========================================================
   SPLASH
========================================================= */

function runSplash() {
    const splash = document.getElementById("splash");
    const bar = document.getElementById("splash-bar");
    const percent = document.getElementById("splash-percent");
    const status = document.getElementById("splash-status");

    const statuses = [
        "SYSTEM INITIALIZING",
        "LOADING PROFILE",
        "SYNCING PROGRESS DATA",
        "INITIALIZING QUEST SYSTEM",
        "CALIBRATING CHARACTER STATS",
        "SYSTEM READY"
    ];

    const start = performance.now();
    const duration = 2200;

    function frame(now) {
        const progress =
            Math.min(1, (now - start) / duration);

        const value =
            Math.floor(progress * 100);

        bar.style.width = value + "%";
        percent.textContent = value + "%";

        const index =
            Math.min(
                statuses.length - 1,
                Math.floor(progress * statuses.length)
            );

        status.textContent = statuses[index];

        if (progress < 1) {
            requestAnimationFrame(frame);
        } else {
            setTimeout(() => {
                splash.classList.add("hide");
            }, 250);
        }
    }

    requestAnimationFrame(frame);

    setTimeout(() => {
        splash.classList.add("hide");
    }, 3500);
}

/* =========================================================
   LOCAL STORAGE HELPERS
========================================================= */

function readJSON(key, fallback) {
    try {
        const raw = localStorage.getItem(key);

        if (!raw) {
            return fallback;
        }

        return JSON.parse(raw);
    } catch {
        return fallback;
    }
}

function writeJSON(key, value) {
    localStorage.setItem(
        key,
        JSON.stringify(value)
    );
}

/* =========================================================
   DAY / SCHEDULE
========================================================= */

function getDayStartHour() {
    if (
        profile &&
        Number.isInteger(Number(profile.day_start_hour))
    ) {
        return Number(profile.day_start_hour);
    }

    const local =
        Number(localStorage.getItem(DAY_START_KEY));

    if (Number.isInteger(local)) {
        return local;
    }

    return 0;
}

function getPersonalDayKey(date = new Date()) {
    const startHour = getDayStartHour();

    const adjusted = new Date(date);

    if (adjusted.getHours() < startHour) {
        adjusted.setDate(
            adjusted.getDate() - 1
        );
    }

    const y = adjusted.getFullYear();
    const m = String(
        adjusted.getMonth() + 1
    ).padStart(2, "0");

    const d = String(
        adjusted.getDate()
    ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}

function getYesterdayPersonalDayKey() {
    const date = new Date();
    date.setDate(date.getDate() - 1);

    return getPersonalDayKey(date);
}

function formatPersonalDay() {
    const start = getDayStartHour();

    const date = new Date();

    if (date.getHours() < start) {
        date.setDate(date.getDate() - 1);
    }

    return date.toLocaleDateString(
        undefined,
        {
            weekday: "long",
            month: "long",
            day: "numeric"
        }
    );
}

async function saveSchedule(hour) {
    profile.day_start_hour = Number(hour);

    localStorage.setItem(
        DAY_START_KEY,
        String(hour)
    );

    if (profile.id) {
        await supabaseClient
            .from("profiles")
            .update({
                day_start_hour: Number(hour)
            })
            .eq("id", profile.id);
    }

    showToast(
        `Personal day now starts at ${formatHour(hour)}.`,
        "success"
    );

    render();
}

function formatHour(hour) {
    hour = Number(hour);

    if (hour === 0) return "12:00 AM";
    if (hour === 12) return "12:00 PM";

    if (hour < 12) {
        return `${hour}:00 AM`;
    }

    return `${hour - 12}:00 PM`;
}

async function getCurrentUser() {
    const {
        data,
        error
    } = await supabaseClient.auth.getUser();

    if (error) {
        return null;
    }

    return data.user;
}

async function loadProfile() {
    const user = await getCurrentUser();

    if (!user) {
        window.location.href =
            "https://qkonsmkzxzkxziektmfx.supabase.co/auth/v1/authorize?provider=email";

        return;
    }

    profile.id = user.id;

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

    if (error) {
        console.error(error);

        showToast(
            "Could not load your profile.",
            "warning"
        );

        return;
    }

    if (data) {
        profile = {
            ...profile,
            ...data,
            stats: {
                ...profile.stats,
                ...(data.stats || {})
            }
        };

        localStorage.setItem(
            DAY_START_KEY,
            String(profile.day_start_hour ?? 0)
        );
    } else {
        await createProfile(user);
    }
}

async function createProfile(user) {
    const name =
        user.user_metadata?.name ||
        user.email?.split("@")[0] ||
        "Player";

    const newProfile = {
        id: user.id,
        name,
        level: 1,
        xp: 0,
        total_xp: 0,
        streak: 0,
        last_active_date: null,
        total_quests_completed: 0,
        total_life_quests: 0,
        social_quests_completed: 0,
        day_start_hour: 0,
        stats: {
            STR: 0,
            INT: 0,
            WIS: 0,
            CHA: 0,
            DEX: 0,
            CRE: 0,
            VIT: 0
        }
    };

    const {
        error
    } = await supabaseClient
        .from("profiles")
        .insert(newProfile);

    if (error) {
        console.error(error);
        return;
    }

    profile = newProfile;
}

async function saveProfile() {
    if (!profile.id) {
        return;
    }

    const payload = {
        name: profile.name,
        level: profile.level,
        xp: profile.xp,
        total_xp: profile.total_xp,
        streak: profile.streak,
        last_active_date: profile.last_active_date,
        total_quests_completed:
            profile.total_quests_completed,
        total_life_quests:
            profile.total_life_quests,
        social_quests_completed:
            profile.social_quests_completed,
        day_start_hour:
            profile.day_start_hour,
        stats: profile.stats
    };

    const {
        error
    } = await supabaseClient
        .from("profiles")
        .update(payload)
        .eq("id", profile.id);

    if (error) {
        console.error(error);
    }
}

/* =========================================================
   XP
========================================================= */

function xpNeededForLevel(level) {
    return Math.max(
        100,
        Number(level) * 100
    );
}

async function addXP(amount, stat = null) {
    amount = Number(amount) || 0;

    profile.xp += amount;
    profile.total_xp += amount;

    if (stat && profile.stats[stat] !== undefined) {
        profile.stats[stat] += 1;
    }

    let leveledUp = false;

    while (
        profile.xp >=
        xpNeededForLevel(profile.level)
    ) {
        profile.xp -=
            xpNeededForLevel(profile.level);

        profile.level += 1;
        leveledUp = true;
    }

    await saveProfile();

    if (leveledUp) {
        showToast(
            `SYSTEM LEVEL UP • LEVEL ${profile.level}`,
            "success"
        );
    }
}

/* =========================================================
   STREAK
========================================================= */

async function updateStreak() {
    const today =
        getPersonalDayKey();

    if (
        profile.last_active_date === today
    ) {
        return;
    }

    const yesterday =
        getYesterdayPersonalDayKey();

    if (
        profile.last_active_date === yesterday
    ) {
        profile.streak += 1;
    } else {
        profile.streak = 1;
    }

    profile.last_active_date = today;

    await saveProfile();
}

/* =========================================================
   QUEST COMPLETION
========================================================= */

async function completeDailyQuest(id) {
    const completed =
        getDailyCompleted();

    if (completed.includes(id)) {
        return;
    }

    const skipped =
        getDailySkipped();

    if (skipped.includes(id)) {
        return;
    }

    const quest =
        getAllDailyQuests()
            .find(q => q.id === id);

    if (!quest) {
        return;
    }

    completed.push(id);

    setDailyCompleted(completed);

    await updateStreak();

    await addXP(
        quest.xp,
        quest.stat
    );

    await questCompletedStats(
        quest
    );

    await checkAchievements();

    showToast(
        `QUEST COMPLETE • +${quest.xp} XP`,
        "success"
    );

    render();
}

async function skipDailyQuest(id) {
    const completed =
        getDailyCompleted();

    if (completed.includes(id)) {
        return;
    }

    const skipped =
        getDailySkipped();

    if (!skipped.includes(id)) {
        skipped.push(id);

    setDailySkipped(skipped);

    showToast(

}

function createMainQuestObject(data) {
    const objectives =
        data.objectives
            .split("\n")
            .map(x => x.trim())
            .filter(Boolean)
            .map((text, index) => ({
                id: `${Date.now()}-${index}`,
                text,
                completed: false
            }));

    return {
        id: "main-" + Date.now(),
        type: "MAIN",
        name: data.name,
        description: data.description || "",
        stat: data.stat,
        xp: Number(data.xp),
        dueDate: data.dueDate || null,
        notes: data.notes || "",
        objectives,
        completed: false,
        skipped: false
    };
}

async function toggleMainObjective(
    questId,
    objectiveId
) {
    const quests =
        getMainQuests();

    const quest =
        quests.find(q => q.id === questId);

    if (!quest || quest.skipped) {
        return;
    }

    const objective =
        quest.objectives
            .find(o => o.id === objectiveId);

    if (!objective) {
        return;
    }

    objective.completed =
        !objective.completed;

    const allDone =
        quest.objectives.length > 0 &&
        quest.objectives.every(
            o => o.completed
        );

    if (allDone && !quest.completed) {
        quest.completed = true;

        await updateStreak();

        await addXP(
            quest.xp,
            quest.stat
        );

        await questCompletedStats(
            quest
        );

        await checkAchievements();

        showToast(
            `MAIN QUEST COMPLETE • +${quest.xp} XP`,
            "success"
        );
    }

    saveMainQuests(quests);

    render();
}

    const quests =

    const quest =
        quests.find(q => q.id === id);

    }

    quest.skipped = true;

    saveMainQuests(quests);

    showToast(
        "Main quest skipped. Your progress is safe.",
        "warning"
    );

    render();
}

async function checkAchievements() {
    const unlocked =
        readJSON(
            ACHIEVEMENTS_KEY,
            []
        );

    let changed = false;

    for (
        const achievement
        of ACHIEVEMENT_DEFINITIONS
    ) {
        if (
            unlocked.includes(
                achievement.id
            )
        ) {
            continue;
        }

        if (
            achievement.condition()
        ) {
            unlocked.push(
                achievement.id
            );

            profile.total_xp +=
                achievement.reward;

            profile.xp +=
                achievement.reward;

            changed = true;

            showToast(
                `ACHIEVEMENT UNLOCKED • ${achievement.name}`,
                "success"
            );
        }
    }

    if (changed) {
        while (
            profile.xp >=
            xpNeededForLevel(profile.level)
        ) {
            profile.xp -=
                xpNeededForLevel(profile.level);

            profile.level += 1;
        }

        writeJSON(
            ACHIEVEMENTS_KEY,
            unlocked
        );

        await saveProfile();
    }
}

            ></textarea>

    );
}

function updateCreateQuestFields() {
    const type =
        document.getElementById(
            "create-type"
        ).value;

    const objectives =
        document.getElementById(
            "main-objectives-field"
        );

    if (type === "MAIN") {
        objectives.classList.remove(
            "hidden"
        );
    } else {
        objectives.classList.add(
            "hidden"
        );
    }
}

function submitCreateQuest() {
    const name =
        document.getElementById(
            "create-name"
        ).value.trim();

    if (!name) {
        showToast(
            "Give your quest a name first.",
            "warning"
        );

        return;
    }

    const type =
        document.getElementById(
            "create-type"
        ).value;

    const difficulty =
        document.getElementById(
            "create-difficulty"
        ).value;

    const stat =
        document.getElementById(
            "create-stat"
        ).value;

    const description =
        document.getElementById(
            "create-description"
        ).value.trim();

    const dueDate =
        document.getElementById(
            "create-date"
        ).value;

    const notes =
        document.getElementById(
            "create-notes"
        ).value.trim();

    if (type === "MAIN") {
        const objectives =
            document.getElementById(
                "create-objectives"
            ).value.trim();

        if (!objectives) {
            showToast(
                "Add at least one objective.",
                "warning"
            );

            return;
        }

        const quest =
            createMainQuestObject({
                name,
                description,
                difficulty,
                stat,
                xp:
                    DIFFICULTIES[difficulty].xp *
                    Math.max(
                        1,
                        objectives.split("\n")
                            .filter(Boolean)
                            .length
                    ),
                dueDate,
                notes,
                objectives
            });

        const quests =
            getMainQuests();

        quests.push(quest);

        saveMainQuests(quests);

        closeModal();

        showToast(
            "Main quest created.",
            "success"
        );

        render();

        return;
    }

    createCustomQuest({
        name,
        description,
        type,
        difficulty,
        stat,
        dueDate,
        notes
    });
}

/* =========================================================
   RENDER HELPERS
========================================================= */

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function questTypeBadge(type) {
    const label =
        type === "MAIN"
            ? "MAIN QUEST"
            : type === "DAILY"
                ? "DAILY"
                : "SIDE QUEST";

    return `
        <span class="badge ${type.toLowerCase()}">
            ${label}
        </span>
    `;
}

function difficultyBadge(difficulty, xp) {
    return `
        <span class="badge xp">
            +${xp} XP
        </span>
    `;
}

function renderQuestActions(
    quest,
    completeAction,
    skipAction,
    deleteAction = null
) {
    if (
        quest.completed ||
        quest.skipped
    ) {
        return `
            <div class="quest-actions">

                ${
                    quest.completed
                        ? `
                            <span class="badge">
                                ✓ COMPLETED
                            </span>
                        `
                        : `
                            <span class="badge skipped">
                                SKIPPED
                            </span>
                        `
                }

                ${
                    deleteAction
                        ? `
                            <button
                                class="btn btn-small btn-danger"
                                onclick="${deleteAction}"
                            >
                                DELETE
                            </button>
                        `
                        : ""
                }

            </div>
        `;
    }

    return `
        <div class="quest-actions">

            <button
                class="btn btn-primary"
                onclick="${completeAction}"
            >
                COMPLETE
            </button>

            <button
                class="btn"
                onclick="${skipAction}"
            >
                SKIP
            </button>

            ${
                deleteAction
                    ? `
                        <button
                            class="btn btn-small btn-danger"
                            onclick="${deleteAction}"
                        >
                            DELETE
                        </button>
                    `
                    : ""
            }

        </div>
    `;
}

                                        onclick="completeLifeQuest()"
                                    >
                                        I DID IT
                                    </button>

                                    <button
                                        class="btn"
                                        onclick="skipLifeQuest()"
                                    >
                                        SKIP
                                    </button>

                                </div>
                            `
                            : `
                                <div class="life-text">
                                    Need something random?
                                </div>

                                <button
                                    class="btn btn-primary"
                                    style="margin-top:18px"
                                    onclick="generateLifeQuest()"
                                >
                                    SURPRISE ME
                                </button>
                            `
                    }

                </div>

            </div>

            <div class="card">

                <div class="card-title">
                    Philosophy
                </div>

                <div class="life-philosophy">
                    You're not trying to become a perfect person.
                    You're just trying to make small progress
                    in your life.
                    <br><br>
                    SENRAI should adapt to the person —
                    not force the person to adapt to SENRAI.
                </div>

            </div>

        </div>
    `;
}

/* =========================================================
   RENDER SETTINGS
========================================================= */

function renderSettings() {
    const current =
        getDayStartHour();

    const options = [
        0,
        3,
        6,
        9,
        12,
        15,
        18,
        21
    ];

    return `
        <div class="page">

            <h1 class="page-title">
                Settings
            </h1>

            <p class="page-subtitle">
                Make SENRAI fit your life.
            </p>

            <div class="section-label">
                PERSONAL SCHEDULE
            </div>

            <div class="card">

                <div class="card-title">
                    When Does Your Day Start?
                </div>

                <div class="schedule-options">

                    ${
                        options
                            .map(hour => `
                                <button
                                    class="schedule-option ${
                                        current === hour
                                            ? "active"
                                            : ""
                                    }"
                                    onclick="saveSchedule(${hour})"
                                >
                                    ${formatHour(hour)}
                                </button>
                            `)
                            .join("")
                    }

                </div>

                <div class="settings-note">
                    Your SENRAI day does not have to start
                    at midnight. Choose when your personal
                    day begins. Daily quests, streaks and
                    progress will follow your schedule.
                </div>

            </div>

            <div class="section-label">
                ACCOUNT
            </div>

            <div class="card">

                <div class="card-title">
                    Profile
                </div>

                <div class="quest-name">
                    ${escapeHTML(profile.name)}
                </div>

                <div class="quest-description">
                    Your progress is synced to your SENRAI account.
                </div>

                <button
                    class="btn btn-danger"
                    style="margin-top:14px"
                    onclick="signOut()"
                >
                    SIGN OUT
                </button>

            </div>

            <div class="section-label">
                SENRAI
            </div>

            <div class="card">

                <div class="quest-description">
                    SENRAI — The System that moves you forward.
                </div>

                <div class="quest-note">
                    The System is here to guide you,
                    not control you.
                </div>

            </div>

        </div>
    `;
}

/* =========================================================
   PAGE RENDER
========================================================= */

function render() {
    const page =
        document.getElementById(
            "page-content"
        );

    if (!page) {
        return;
    }

    document.getElementById(
        "top-user-name"
    ).textContent =
        profile.name || "Player";

    document.getElementById(
        "top-user-level"
    ).textContent =
        `LEVEL ${profile.level}`;

    switch (currentPage) {
        case "quests":
            page.innerHTML =
                renderQuests();
            break;

        case "stats":
            page.innerHTML =
                renderStats();
            break;

        case "achievements":
            page.innerHTML =
                renderAchievements();
            break;

        case "life":
            page.innerHTML =
                renderLife();
            break;

        case "settings":
            page.innerHTML =
                renderSettings();
            break;

        default:
            page.innerHTML =
                renderHome();
    }

    document
        .querySelectorAll(".nav-btn")
        .forEach(button => {
            button.classList.toggle(
                "active",
                button.dataset.page ===
                currentPage
            );
        });
}

function navigate(page) {
    currentPage = page;

    render();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

/* =========================================================
   NAV EVENTS
========================================================= */

document
    .querySelectorAll(".nav-btn")
    .forEach(button => {
        button.addEventListener(
            "click",
            () => {
                navigate(
                    button.dataset.page
                );
            }
        );
    });

/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    type = ""
) {
    const container =
        document.getElementById(
            "toast-container"
        );

    const toast =
        document.createElement("div");

    toast.className =
        `toast ${type}`;

    toast.textContent =
        message;

    container.appendChild(toast);

    setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform =
            "translateY(-5px)";

        setTimeout(() => {
            toast.remove();
        }, 300);

    }, 2800);
}

/* =========================================================
   SIGN OUT
========================================================= */

async function signOut() {
    await supabaseClient.auth.signOut();

    location.reload();
}

/* =========================================================
   STARTUP
========================================================= */

async function startApp() {
    try {
        runSplash();

        await loadProfile();

        await checkAchievements();

        render();

        document
            .getElementById("app")
            .classList.remove("hidden");

    } catch (error) {
        console.error(
            "SENRAI startup error:",
            error
        );

        showToast(
            "System started with limited functionality.",
            "warning"
        );

        document
            .getElementById("app")
            .classList.remove("hidden");

        render();

    } finally {
        setTimeout(() => {
            document
                .getElementById("splash")
                .classList.add("hide");
        }, 3500);
    }
}

startApp();
</script>
